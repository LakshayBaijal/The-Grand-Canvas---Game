<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Canvas — 2v2, coming at 10 lakh (16s)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: center; transform: translate(-50%, -50%); background: #0B0920; }
  #c { position: absolute; inset: 0; }
  #wg { position: absolute; border-radius: 22px; opacity: 0; box-shadow: 0 10px 40px rgba(0,0,0,.5); pointer-events: none; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; background: rgba(11,9,32,.92); color: #FFC53D; text-align: center; }
  #start b { display: block; font-size: 72px; font-weight: 900; letter-spacing: 4px; }
  #start span { display: block; margin-top: 24px; font-size: 30px; color: #9E97CE; line-height: 1.5; }
  #start kbd { color: #F6F4FF; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <img id="wg" src="assets/whosegames.gif" alt="">
  <div id="start"><div><b>2 v 2</b><span>16 second teaser &middot; 1920&times;1080<br><br><kbd>click</kbd> or <kbd>space</kbd> to play<br><kbd>R</kbd> replay &nbsp;&middot;&nbsp; <kbd>M</kbd> mute &nbsp;&middot;&nbsp; <kbd>L</kbd> loop</span></div></div>
</div>

<script src="engine.js"></script>
<script>
/**
 * 2v2, the teaser. Two pens on one sheet, both drawing the same rocket at the
 * same time -- each in its own place, over the other's lines, bumping. They
 * stop and stare at the mess. Then the third character walks in: the eraser.
 * It sweeps top to bottom, and as it passes, the wrong lines go and the
 * right ones slide into place -- the mess they were fighting over turns out
 * to be one rocket. Then, in sync, the two pens add the flames together.
 * Funded. A three-way high five. Unlocks at 10 lakh downloads.
 *
 *   0.3  the pens enter                    5.2  the eraser: wrong lines go,
 *   1.0  the clash: two rockets at once         right ones snap into place
 *   4.3  they stop -- "?"                  8.7  in sync: the flames, together
 *  10.4  money, the stamp                 12.1  high five      13.4  the card
 */
const W2 = 1920, H2 = 1080;
const T = { enter: 0.3, clash: 1.0, stop: 4.3, erase: 5.2, eraseEnd: 8.4, sync: 8.7, syncEnd: 9.9, money: 10.4, stamp: 11.2, five: 12.1, card: 13.4, end: 16.0 };
const PINK = '#FF5C8A', CYAN = '#3DDCFF';
const PW = 900, PH = 720, PX = (W2 - PW) / 2, PY = 110;
const P = (x, y) => ({ x, y });

// --- a pen in a colour (the engine's pencil is always gold) -------------------
function pen(x, y, s, angle, colour, dark) {
  g.save(); g.translate(x, y); g.rotate(angle); g.lineCap = 'round';
  g.strokeStyle = colour; g.lineWidth = s * .07; g.beginPath(); g.moveTo(0, -s * .04); g.lineTo(0, -s * .34); g.stroke();
  g.strokeStyle = dark; g.lineWidth = s * .07; g.beginPath(); g.moveTo(0, -s * .34); g.lineTo(0, -s * .40); g.stroke();
  g.strokeStyle = '#E8D9B8'; g.lineWidth = s * .06; g.beginPath(); g.moveTo(0, -s * .04); g.lineTo(0, -s * .012); g.stroke();
  g.fillStyle = '#1A1A1A'; g.beginPath(); g.arc(0, 0, s * .014, 0, 7); g.fill();
  g.restore();
}
// --- the eraser: the third one. A two-tone rubber with a face -----------------
function eraser(x, y, angle, squash = 1, scale = 1, blink = false) {
  g.save(); g.translate(x, y); g.rotate(angle); g.scale(scale / squash, scale * squash);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 18; g.shadowOffsetY = 8;
  g.fillStyle = '#F4A7C3'; roundRect(-70, -44, 140, 88, 16); g.fill(); g.shadowColor = 'transparent'; g.shadowOffsetY = 0;
  g.fillStyle = '#7FB6E6'; g.save(); roundRect(-70, -44, 140, 88, 16); g.clip(); g.fillRect(28, -44, 42, 88); g.restore();
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; roundRect(-70, -44, 140, 88, 16); g.stroke();
  g.fillStyle = '#1A1A1A';
  if (blink) { g.lineWidth = 4; g.strokeStyle = '#1A1A1A'; g.beginPath(); g.moveTo(-34, -8); g.lineTo(-18, -8); g.moveTo(-2, -8); g.lineTo(14, -8); g.stroke(); }
  else { g.beginPath(); g.arc(-26, -8, 5, 0, 7); g.arc(6, -8, 5, 0, 7); g.fill(); }
  g.strokeStyle = '#1A1A1A'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.arc(-10, 4, 14, 0.3, Math.PI - 0.3); g.stroke();
  g.restore();
}
const sheet = (px, py) => P(PX + px * PW, PY + py * PH);
function ink(pts, upto, colour, width, wob = 1.6, seed = 3, alpha = 1) {
  const r = rng(seed), n = Math.max(2, Math.ceil(pts.length * upto));
  g.save(); g.globalAlpha *= alpha;
  g.strokeStyle = colour; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) { const p = sheet(pts[i].x, pts[i].y); const wx = (r() - .5) * wob, wy = (r() - .5) * wob; i ? g.lineTo(p.x + wx, p.y + wy) : g.moveTo(p.x + wx, p.y + wy); }
  g.stroke(); g.restore(); return sheet(pts[n - 1].x, pts[n - 1].y);
}
const seg = (a, b, n = 10) => Array.from({ length: n + 1 }, (_, i) => P(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n));
const arcPts = (cx, cy, r, from, to, n = 20) => Array.from({ length: n + 1 }, (_, i) => { const a = from + (to - from) * i / n; return P(cx + Math.cos(a) * r, cy + Math.sin(a) * r); });
const mirror = pts => pts.map(p => P(1 - p.x, p.y));
// shift and tilt a stroke about the sheet's centre
const xf = (pts, dx, dy, rot) => pts.map(p => { const x = (p.x - .5) * PW, y = (p.y - .5) * PH; const c = Math.cos(rot), s = Math.sin(rot); return P(.5 + (x * c - y * s) / PW + dx, .5 + (x * s + y * c) / PH + dy); });
const lerpPts = (a, b, u) => a.map((p, i) => P(p.x + (b[i].x - p.x) * u, p.y + (b[i].y - p.y) * u));
const meanY = pts => pts.reduce((s, p) => s + p.y, 0) / pts.length;

// --- the rocket, without its flames: left half and right half ---------------------------
const LEFT = [
  [P(.5, .16), P(.46, .21), P(.42, .30), P(.40, .42), P(.40, .60), P(.40, .70)],   // body, nose to base
  arcPts(.5, .45, .07, Math.PI * 0.5, Math.PI * 1.5, 14),                           // window, left half
  [P(.40, .58), P(.31, .74), P(.34, .76), P(.40, .72)],                           // fin
  seg(P(.40, .70), P(.50, .70), 8),                                                // base, to the middle
];
const RIGHT = LEFT.map(mirror);
const FULL = [...LEFT, ...RIGHT];                       // one whole rocket, in the right place
// the clash: each pen draws the WHOLE rocket, but in its own place
const PINK_CLASH = FULL.map(s => xf(s, -.075, .035, -.20));
const CYAN_CLASH = FULL.map(s => xf(s, .075, -.020, .19));
// what survives the eraser: pink's left half, cyan's right half -- the rest was the mess
const KEEP_P = [true, true, true, true, false, false, false, false];
const KEEP_C = KEEP_P.map(k => !k);
const CLASH_T = (() => { const n = FULL.length, d = (T.stop - .15 - T.clash) / n; return FULL.map((_, i) => [T.clash + i * d, T.clash + (i + 1) * d]); })();
const BUMPS = [2.0, 2.8, 3.6];
// the flames: what they add together, in sync, once the rocket is right
const FLAME_L = [P(.43, .72), P(.45, .84), P(.47, .78), P(.49, .90)];
const FLAME_R = mirror(FLAME_L);

// --- money and stamp ---------------------------------------------------------------------
const NOTES2 = (() => { const r = rng(42); return Array.from({ length: 9 }, (_, i) => ({ t: T.money + i * .07, from: P(r() < .5 ? -.15 : 1.15, r() * 1.1 - .05), to: P(.30 + r() * .40, .35 + r() * .35), rot: (r() - .5) * .8 })); })();
const CONF2 = (() => { const r = rng(9); const cols = [PINK, CYAN, C.lime, C.primary, C.purple]; return Array.from({ length: 70 }, () => ({ a: r() * 6.28, v: 420 + r() * 700, s: 8 + r() * 12, c: cols[Math.floor(r() * cols.length)], spin: (r() - .5) * 12, up: .4 + r() * .8 })); })();
const CRUMBS = (() => { const r = rng(77); return Array.from({ length: 46 }, () => ({ t: T.erase + .15 + r() * (T.eraseEnd - T.erase - .3), dx: (r() - .5) * 130, vy: 60 + r() * 130, s: 4 + r() * 5 })); })();

// The eraser sweeps top to bottom, wandering side to side. Everything else --
// which line goes, which line slides home -- is keyed off where it has got to.
function eraserAt(t) {
  const u = win(t, T.erase, T.eraseEnd);
  return { u, x: PX + PW / 2 + Math.sin(u * Math.PI * 5) * PW * .34, y: PY - 20 + u * (PH + 70), angle: Math.cos(u * Math.PI * 5) * .3 };
}
// when the eraser reaches a stroke sitting at this height on the sheet
const gateFor = m => T.erase + (T.eraseEnd - T.erase) * Math.max(0, Math.min(1, (m * PH + 20) / (PH + 70)));

function duoFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  let sx = 0, sy = 0;
  for (const b of BUMPS) if (t > b && t < b + .18) { const k = (1 - win(t, b, b + .18)) * 10; sx += Math.sin(t * 180) * k; sy += Math.cos(t * 220) * k; }
  if (t > T.stamp && t < T.stamp + .22) { const k = (1 - win(t, T.stamp, T.stamp + .22)) * 14; sx += Math.sin(t * 190) * k; sy += Math.cos(t * 230) * k; }
  g.translate(sx, sy);
  g.fillStyle = C.bg; g.fillRect(-40, -40, W + 80, H + 80);
  const glow = g.createRadialGradient(960, 470, 0, 960, 470, 1000); glow.addColorStop(0, 'rgba(255,197,61,.14)'); glow.addColorStop(1, 'rgba(255,197,61,0)'); g.fillStyle = glow; g.fillRect(0, 0, W, H);

  const cardU = win(t, T.card, T.card + .6);
  // the sheet
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 44; g.shadowOffsetY = 18; g.fillStyle = C.paper; g.fillRect(PX, PY, PW, PH); g.shadowColor = 'transparent'; g.shadowOffsetY = 0;
  paintPaper(PX, PY, PW, PH); g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(PX + 1, PY + 1, PW - 2, PH - 2);
  g.fillStyle = C.surface; roundRect(PX + 20, PY + 20, 150, 52, 26); g.fill(); text('2 v 2', PX + 95, PY + 46, 26, C.primary, { spacing: 4 });

  let tipL = null, tipR = null;
  const er = eraserAt(t);

  // --- the drawing. Every stroke is the same object all the way through: drawn
  // in the clash, then either rubbed out or slid home as the eraser passes it.
  if (t >= T.clash) {
    for (let i = 0; i < FULL.length; i++) {
      const [a, b] = CLASH_T[i]; if (t < a) break;
      const drawn = win(t, a, b);
      for (const side of [0, 1]) {
        const clash = side ? CYAN_CLASH[i] : PINK_CLASH[i], keep = side ? KEEP_C[i] : KEEP_P[i];
        const gate = gateFor(meanY(clash)), res = t >= T.erase ? easeOut(win(t, gate, gate + .45)) : 0;
        const pts = keep ? lerpPts(clash, FULL[i], res) : clash;
        const alpha = keep ? 1 : 1 - res;
        if (alpha <= 0.01) continue;
        const wob = 2.2 - res * 1.0;
        const tip = ink(pts, drawn, side ? CYAN : PINK, 9, wob, (side ? 71 : 61) + i, alpha);
        if (drawn < 1 && t < T.stop) { if (side) tipR = tip; else tipL = tip; }
      }
    }
    // bumps where their lines cross
    for (const b of BUMPS) if (t > b && t < b + .5) { const u = win(t, b, b + .5), c = P(PX + PW / 2, PY + PH * (.26 + (b - 2) * .14));
      for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28; g.strokeStyle = i % 2 ? PINK : CYAN; g.lineWidth = 5 * (1 - u); g.beginPath(); g.moveTo(c.x + Math.cos(a) * 14, c.y + Math.sin(a) * 14); g.lineTo(c.x + Math.cos(a) * (30 + 60 * u), c.y + Math.sin(a) * (30 + 60 * u)); g.stroke(); }
      text('!', c.x, c.y - 60 - u * 40, 54, C.ink, { alpha: 1 - u }); }
  }
  // --- in sync: the flames, both at once, once the rocket is right
  if (t >= T.sync) {
    const u = win(t, T.sync, T.syncEnd);
    const l = ink(FLAME_L, u, PINK, 9, 1.2, 91), r = ink(FLAME_R, u, CYAN, 9, 1.2, 92);
    if (t < T.syncEnd + .2) { tipL = l; tipR = r; }
  }

  // --- where the pens are
  const enterU = easeOut(win(t, T.enter, T.enter + .6));
  let angL = -0.9, angR = 0.9;
  if (t < T.clash) { tipL = sheet(lerp(-.3, .37, enterU), .17); tipR = sheet(lerp(1.3, .63, enterU), .17); }
  if (t >= T.stop && t < T.sync) {          // they stop, back off, and watch it happen
    const u = easeOut(win(t, T.stop, T.stop + .45)); const l = tipL || sheet(.35, .45), r = tipR || sheet(.65, .45);
    const rest = t >= T.erase - .2 ? easeOut(win(t, T.erase - .2, T.erase + .25)) : 0;
    const lx = lerp(PX + PW * .10, PX - 40, rest), rx = lerp(PX + PW * .90, PX + PW + 40, rest);
    const ly = lerp(PY + PH * .26, PY + PH * .80, rest), ry = ly;
    tipL = P(lerp(l.x, lx, u), lerp(l.y, ly, u)); tipR = P(lerp(r.x, rx, u), lerp(r.y, ry, u));
    const tilt = Math.sin((t - T.stop) * 9) * .12 * (1 - win(t, T.stop + .5, T.stop + .8));
    angL = lerp(-0.5 + tilt, -0.35, rest); angR = lerp(0.5 - tilt, 0.35, rest);
  }
  let fiveU = 0;
  const fc = P(PX + PW / 2, PY + 340);
  if (t >= T.syncEnd + .2 && t < T.five) {  // they step back and look at what they made
    const u = easeOut(win(t, T.syncEnd + .2, T.syncEnd + .6));
    tipL = P(lerp(fc.x - 120, PX - 20, u), lerp(PY + PH * .9, PY + PH * .72, u));
    tipR = P(lerp(fc.x + 120, PX + PW + 20, u), lerp(PY + PH * .9, PY + PH * .72, u));
    angL = -0.35; angR = 0.35;
  }
  if (t >= T.five) { fiveU = back(win(t, T.five, T.five + .45)); const k = 1 - Math.min(1, fiveU);
    tipL = P(fc.x - 34 * k - 6, fc.y + k * 300); tipR = P(fc.x + 34 * k + 6, fc.y + k * 300); angL = -0.8; angR = 0.8; }
  if (tipL) pen(tipL.x, tipL.y, 520, angL, PINK, '#B0264F');
  if (tipR) pen(tipR.x, tipR.y, 520, angR, CYAN, '#1C8CA8');
  // "?" while they stare at the mess
  if (t >= T.stop + .25 && t < T.erase + .3) { const u = back(win(t, T.stop + .25, T.stop + .55)), a = 1 - win(t, T.erase, T.erase + .3); text('?', PX + PW / 2, PY + PH * .10, 90, C.ink, { scale: u, alpha: a, rot: .1 }); }

  // --- the eraser: in from the right, down the sheet, then it waits at the bottom
  if (t < T.five) {
    const inU = easeOut(win(t, T.erase - .7, T.erase)), outU = easeOut(win(t, T.eraseEnd, T.eraseEnd + .5));
    if (t >= T.erase - .7) {
      const ex = t < T.erase ? lerp(W + 130, er.x, inU) : t < T.eraseEnd ? er.x : lerp(er.x, PX + PW / 2, outU);
      const ey = t < T.eraseEnd ? er.y : lerp(er.y, PY + PH + 96, outU);
      const scrub = t >= T.erase && t < T.eraseEnd ? 1 + Math.sin(t * 40) * .06 : 1;
      const hop = t > T.eraseEnd + .5 ? Math.abs(Math.sin((t - T.eraseEnd) * 3.4)) * 14 : 0;   // it bounces, pleased with itself
      eraser(ex, ey - hop, t < T.erase ? -.2 : t < T.eraseEnd ? er.angle : 0, scrub, t < T.eraseEnd ? 1 : lerp(1, .8, outU), Math.floor(t * 3) % 11 === 0);
    }
    for (const c of CRUMBS) { const ct = t - c.t; if (ct < 0 || ct > .7) continue; const e0 = eraserAt(c.t);
      g.fillStyle = 'rgba(120,110,120,' + (1 - ct / .7) + ')'; g.beginPath(); g.arc(e0.x + c.dx, e0.y + 30 + c.vy * ct + ct * ct * 400, c.s, 0, 7); g.fill(); }
  }

  // high five burst
  if (t >= T.five) { const u = win(t, T.five + .2, T.five + .8);
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; g.strokeStyle = i % 2 ? PINK : CYAN; g.lineWidth = 6 * (1 - u); g.globalAlpha = 1 - u; g.beginPath(); g.moveTo(fc.x + Math.cos(a) * 30, fc.y + Math.sin(a) * 30); g.lineTo(fc.x + Math.cos(a) * (60 + 120 * u), fc.y + Math.sin(a) * (60 + 120 * u)); g.stroke(); }
    g.globalAlpha = 1; text('HIGH FIVE!', fc.x, PY - 52, 48, C.primary, { spacing: 4, glow: 20, scale: fiveU, rot: -.04 }); }

  // money and the stamp
  if (t >= T.money) for (const n of NOTES2) { if (t < n.t) continue; const u = win(t, n.t, n.t + .32), e = easeOut(u); const X = PX + lerp(n.from.x, n.to.x, e) * PW, Y = PY + lerp(n.from.y, n.to.y, e) * PH - Math.sin(u * Math.PI) * 80; note(X, Y, lerp(n.rot * 3, n.rot, e), 120 * (u >= 1 ? 1 : 1.22 - .22 * e)); }
  if (t >= T.stamp) {
    const u = win(t, T.stamp, T.stamp + .26), sc = lerp(3, 1, easeOut(u)), al = Math.min(1, u * 3), cx = PX + PW / 2, cy = PY + PH / 2 + 10;
    g.save(); g.translate(cx, cy); g.rotate(-.2); g.scale(sc, sc); g.globalAlpha = al;
    g.strokeStyle = C.funded; g.lineWidth = 11; roundRect(-190, -60, 380, 120, 18); g.stroke(); g.lineWidth = 4; roundRect(-176, -46, 352, 92, 14); g.stroke(); g.restore();
    text('FUNDED!', cx, cy, 84, C.funded, { spacing: 4, rot: -.2, scale: sc, alpha: al, glow: 24 });
    for (const c of CONF2) { const ct = t - T.stamp; const drag = 1 - Math.exp(-ct * 3); const X = cx + Math.cos(c.a) * c.v * drag / 3.2, Y = cy + Math.sin(c.a) * c.v * drag / 3.2 + ct * ct * 1100 - c.up * 320 * ct;
      g.save(); g.translate(X, Y); g.rotate(c.spin * ct); g.globalAlpha = 1 - win(ct, .9, 1.3); g.fillStyle = c.c; g.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); g.restore(); }
    g.globalAlpha = 1;
    const tu = back(win(t, T.stamp + .3, T.stamp + .7));
    if (tu > 0) text('$2,000 RAISED · TOGETHER', PX + PW / 2, PY + PH + 58, 34 * tu, C.lime, { spacing: 4, glow: 16, alpha: Math.min(1, tu) });
  }

  // the eraser jumps for joy under them, on top of everything
  if (t >= T.five) { const hop = Math.abs(Math.sin((t - T.five) * 5.2)) * 70;
    eraser(PX - 100, PY + PH * .80 - hop, Math.sin(t * 6) * .12, 1 + hop / 700, .9); }

  // captions
  const cap = (s, from, to, y = 990) => { const a = easeOut(win(t, from, from + .25)) * (1 - win(t, to - .2, to)); if (a > 0) text(s, 960, y, 34, C.primary, { spacing: 5, alpha: a }); };
  cap('TWO PENS. ONE CANVAS.', T.enter + .2, T.clash + .9);
  cap('SAME ROCKET. OVER EACH OTHER.', T.clash + .9, T.stop + .4);
  cap('THEN THE ERASER STEPS IN.', T.erase - .4, T.eraseEnd - .6);
  cap('THE MESS WAS ONE ROCKET ALL ALONG.', T.eraseEnd - .6, T.sync + .2);
  cap('NOW, IN SYNC.', T.sync + .2, T.stamp + .3);

  // the card: the whole scene goes to dark under it
  if (cardU > 0) { g.globalAlpha = cardU; g.fillStyle = C.bg; g.fillRect(-40, -40, W + 80, H + 80); g.globalAlpha = 1; }
  if (t >= T.card) {
    const s = back(win(t, T.card + .05, T.card + .5));
    const gl = g.createRadialGradient(960, 520, 0, 960, 520, 900); gl.addColorStop(0, `rgba(255,197,61,${.32 * easeOut(cardU)})`); gl.addColorStop(1, 'rgba(255,197,61,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H);
    text('2 v 2', 960, 300 + (1 - s) * 40, 150, C.primary, { spacing: 14, glow: 50, alpha: Math.min(1, s), scale: s });
    const wu = easeOut(win(t, T.card + .35, T.card + .75));
    text('TWO PLAYERS. ONE CANVAS. ONE PITCH.', 960, 430, 36, C.text, { weight: 800, spacing: 3, alpha: wu });
    const pu = back(win(t, T.card + .6, T.card + 1.05));
    if (pu > 0) { g.save(); g.translate(960, 560); g.scale(pu, pu); g.globalAlpha = Math.min(1, pu);
      g.shadowColor = 'rgba(255,197,61,.55)'; g.shadowBlur = 46; g.fillStyle = C.primary; roundRect(-420, -56, 840, 112, 56); g.fill(); g.shadowColor = 'transparent';
      text('UNLOCKS AT 10,00,000 DOWNLOADS', 0, 2, 34, C.onPrimary, { spacing: 3 }); g.restore(); }
    const su = easeOut(win(t, T.card + 1.0, T.card + 1.4));
    text('Share Grand Canvas. Get us there.', 960, 660, 34, C.muted, { weight: 700, alpha: su });
    if (icon.complete && icon.naturalWidth) { g.save(); g.globalAlpha = su; g.translate(830, 790); roundRect(-52, -52, 104, 104, 24); g.clip(); g.drawImage(icon, -52, -52, 104, 104); g.restore(); }
    text('GRAND CANVAS', 905, 790, 44, C.primary, { align: 'left', spacing: 5, glow: 20, alpha: su });
    text('a  W H O S E G A M E S  game', 960, 945, 24, C.muted, { weight: 700, alpha: su });
  }
  wg.style.opacity = t >= T.card ? easeOut(win(t, T.card + 1.0, T.card + 1.4)) : 0;
}
window.frame = duoFrame;
prepareStage(W2, H2, { x: 912, y: 860, size: 80 });
runPlayback(duoFrame, T.end, [
  ['bed',     'assets/duo_bed.mp3',     0,             .9],

]);
