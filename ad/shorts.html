<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Canvas — 10s portrait ads</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: center; transform: translate(-50%, -50%); background: #1A1630; }
  #c { position: absolute; inset: 0; }
  #wg { position: absolute; border-radius: 22px; opacity: 0; box-shadow: 0 10px 40px rgba(0,0,0,.5); pointer-events: none; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; background: rgba(11,9,32,.92); color: #FFC53D; text-align: center; }
  #start b { display: block; font-size: 64px; font-weight: 900; letter-spacing: 4px; }
  #start span { display: block; margin-top: 24px; font-size: 26px; color: #9E97CE; line-height: 1.5; }
  #start kbd { color: #F6F4FF; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <img id="wg" src="assets/whosegames.gif" alt="">
  <div id="start"><div><b id="title">DRAW ANYTHING</b><span>10 second portrait ad &middot; 1080&times;1920<br><br><kbd>click</kbd> or <kbd>space</kbd> to play<br><kbd>R</kbd> replay &nbsp;&middot;&nbsp; <kbd>M</kbd> mute &nbsp;&middot;&nbsp; <kbd>L</kbd> loop</span></div></div>
</div>

<script src="engine.js"></script>
<script>
/**
 * The 10-second portrait ads -- ?v=tree, ?v=cat, ?v=rex.
 *
 * Built for a feed, which is a different job from the trailers: nobody
 * chose to watch this, so the first second has to take the frame by force
 * and the whole story has to be over before a thumb moves. Hence the slam
 * -- the pencil drops in and hits the paper hard enough to shake the
 * camera and throw ink -- and hence only one idea per film, drawn in three
 * and a half seconds and paid off in under four.
 *
 *   0.00  the slam: pencil down, ink splat, shake, "DRAW ANYTHING"
 *   0.95  the pencil draws the scene
 *   4.75  it comes alive -- the one thing each film is about
 *   8.50  the card
 *
 * Everything on the paper is a line puppet, same as life.html: a stroke is
 * a function of a pose and a pose is a function of time, and the wobble is
 * reseeded eight times a second for the boil of pencil animation. The three
 * variants share the paper, the slam, the pencil and the card, and differ
 * only in a still() to be drawn and a live(a) to move.
 */
const V = new URLSearchParams(location.search).get('v') || 'tree';
const W2 = 1080, H2 = 1920;
const T = { slam: 0.20, draw: 0.95, drawn: 4.45, alive: 4.75, card: 8.50, end: 10.0 };
const INK = '#23201d';

// --- the sheet -------------------------------------------------------------
const PW = 920, PH = 1150, PX = (W2 - PW) / 2, PY = 330;
const off = document.createElement('canvas'); off.width = PW; off.height = PH;
const og = off.getContext('2d');

const P = (x, y) => ({ x, y });
const seg = (a, b, n = 8) => Array.from({ length: n + 1 }, (_, i) => P(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n));
const circ = (cx, cy, r, n = 26, from = 0, to = Math.PI * 2) => Array.from({ length: n + 1 }, (_, i) => { const a = from + (to - from) * i / n; return P(cx + Math.cos(a) * r, cy + Math.sin(a) * r); });
const ell = (cx, cy, rx, ry, n = 30, from = 0, to = Math.PI * 2) => Array.from({ length: n + 1 }, (_, i) => { const a = from + (to - from) * i / n; return P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); });
const qcurve = (a, b, c, n = 14) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, k = 1 - u;
  return P(k * k * a.x + 2 * k * u * b.x + u * u * c.x, k * k * a.y + 2 * k * u * b.y + u * u * c.y); });

function breeze(t) { return 1 + Math.exp(-Math.pow((t - T.slam) / 0.5, 2)) * 2.2; }
function layPaper(t) {
  const strips = 34, sw = PW / strips, k = breeze(t);
  g.save();
  g.translate(PX + PW / 2, PY + PH / 2); g.rotate(Math.sin(t * 0.9) * 0.005 * k); g.translate(-(PX + PW / 2), -(PY + PH / 2));
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < strips; i++) {
      const u = (i + 0.5) / strips, free = Math.pow(u, 1.6);
      const lift = (Math.sin(u * 5.2 - t * 2.1) * 8 * k + Math.sin(u * 11 - t * 3.7) * 3 * k) * free;
      const x = PX + i * sw;
      if (pass === 0) { g.fillStyle = 'rgba(0,0,0,.30)'; g.fillRect(x + 12, PY + 18 + lift * .5 + free * 6 * k, sw + 1, PH); }
      else g.drawImage(off, i * sw, 0, sw, PH, x, PY + lift, sw + 1, PH);
    }
  }
  const tape = (x, y, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(-44, -12, 88, 24); g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(-44, -12, 88, 3); g.restore(); };
  tape(PX + 58, PY + 4, -.08);
  tape(PX + PW - 58, PY + 4 + Math.sin(t * 2.1 - 5.2) * 2 * k, .07);
  g.restore();
}

function boilSeed(t) { return 100 + Math.floor(t * 8); }
function inkStroke(ctx, pts, width, upto, seed, wob = 2.2) {
  if (!pts || pts.length < 2) { console.warn('inkStroke: short stroke', pts && pts.length, new Error().stack.split('\n')[2]); return pts && pts[0] || P(0, 0); }
  const r = rng(seed), n = Math.max(2, Math.ceil(pts.length * upto));
  ctx.strokeStyle = INK; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const p = pts[i], wx = (r() - .5) * wob, wy = (r() - .5) * wob; i ? ctx.lineTo(p.x + wx, p.y + wy) : ctx.moveTo(p.x + wx, p.y + wy); }
  ctx.stroke();
  return pts[n - 1];
}

// --- the man, small enough to share a frame with whatever else turns up ------
function man(x, gy, { arm = 0, crouch = 0, run = 0, phase = 0, lean = 0, look = 0 } = {}) {
  const s = 1 - crouch * .18;
  const hipY = gy - 130 * s, shY = gy - 228 * s, headY = gy - 276 * s;
  const tip = crouch * 26 + lean;
  const out = [];
  out.push([circ(x + tip * 1.4, headY - tip * .2, 31), 6]);
  out.push([seg(P(x + tip, shY), P(x, hipY)), 7]);
  const sw = Math.sin(phase) * 34 * run, lift = Math.max(0, Math.cos(phase)) * 22 * run;
  out.push([seg(P(x, hipY), P(x - 28 - sw, gy - lift)), 6]);
  out.push([seg(P(x, hipY), P(x + 26 + sw, gy)), 6]);
  const ax = x + tip, ay = shY + 8;
  const a = arm <= 1 ? lerp(.9, -2.2, arm) : lerp(-2.2, .35, arm - 1);
  const elbow = P(ax + Math.sin(a) * 50, ay + Math.cos(a) * 50);
  const bend = arm <= 1 ? lerp(.2, 1.4, arm) : lerp(1.4, -.1, arm - 1);
  const hand = P(elbow.x + Math.sin(a + bend) * 48, elbow.y + Math.cos(a + bend) * 48);
  out.push([seg(P(ax, ay), elbow), 6]); out.push([seg(elbow, hand), 6]);
  const ba = -.5 - run * .9 + Math.sin(phase + Math.PI) * .7 * run;
  out.push([seg(P(ax, ay), P(ax + Math.sin(ba) * 78, ay + Math.cos(ba) * 78)), 6]);
  // face: two eyes, shifted by `look` (-1 back over the shoulder .. +1 forward)
  const fx = x + tip * 1.4 + look * 10, fy = headY - tip * .2;
  out.push([circ(fx + 8, fy - 6, 2.5, 8), 5]); out.push([circ(fx + 19, fy - 6, 2.5, 8), 5]);
  return { strokes: out, hand, head: P(x + tip * 1.4, headY - tip * .2) };
}

// ===========================================================================
// the three films
// ===========================================================================
// A lumpy closed outline -- foliage, not a circle. Three circles read as
// three circles; a wobbling radius reads as a tree.
const blob = (cx, cy, r, seed = 1, n = 46, squash = .86) => {
  const r0 = rng(seed), k1 = .10 + r0() * .06, k2 = .05 + r0() * .05, p1 = r0() * 6, p2 = r0() * 6;
  return Array.from({ length: n + 1 }, (_, i) => { const a = i / n * Math.PI * 2;
    const rr = r * (1 + Math.sin(a * 5 + p1) * k1 + Math.sin(a * 8 + p2) * k2);
    return P(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * squash); });
};

// Catmull-Rom through a handful of control points. Bodies built straight from
// their corners read as crystals; run through here they read as animals.
const smooth = (pts, per = 8, closed = true) => {
  const m = pts.length, get = i => pts[(i % m + m) % m], out = [];
  const count = closed ? m : m - 1;
  for (let i = 0; i < count; i++) {
    const p0 = closed ? get(i - 1) : pts[Math.max(0, i - 1)], p1 = get(i);
    const p2 = closed ? get(i + 1) : pts[Math.min(m - 1, i + 1)], p3 = closed ? get(i + 2) : pts[Math.min(m - 1, i + 2)];
    for (let j = 0; j < per; j++) { const t = j / per, t2 = t * t, t3 = t2 * t;
      out.push(P(
        .5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        .5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3))); }
  }
  out.push(closed ? out[0] : pts[m - 1]);
  return out;
};

const SCENES = {

// --- a seed becomes a tree, and the tree has opinions ----------------------
tree: {
  title: 'DRAW A SEED',
  caps: [['DRAW A SEED.', T.draw + .3, T.alive + .2], ['WATCH IT GROW.', T.alive + .3, T.card]],
  GY: 1030,
  still() {
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);                     // ground
    for (const st of man(340, 1030).strokes) out.push(st);
    out.push([qcurve(P(586, 1030), P(620, 978), P(654, 1030)), 5]);        // the mound
    out.push([seg(P(620, 1000), P(620, 936)), 5]);                         // the sprout
    out.push([qcurve(P(620, 948), P(578, 908), P(620, 886)), 4]);          // two little leaves
    out.push([qcurve(P(620, 948), P(662, 908), P(620, 886)), 4]);
    return out;
  },
  live(a) {
    const grow = easeOut(win(a, .15, 1.9));
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);
    // The trunk stops at 500, which is inside the canopy's lower edge: run any
    // higher and it spears straight out of the top of the tree, because the
    // foliage is an outline with nothing to hide it.
    const topY = lerp(940, 500, grow);
    const edge = (x0, x1, xm) => qcurve(P(x0, 1030), P(xm, lerp(980, 700, grow)), P(x1, topY), 16);
    out.push([edge(572, 610, 584), 6]);
    out.push([edge(668, 630, 656), 6]);
    out.push([qcurve(P(534, 1032), P(568, 1008), P(584, 1028)), 4]);       // root flare
    out.push([qcurve(P(706, 1032), P(672, 1008), P(656, 1028)), 4]);
    // branches: one out over his head, one the other way
    const b1 = easeOut(win(a, .8, 1.4)), b2 = easeOut(win(a, 1.0, 1.6));
    if (b1 > 0) out.push([qcurve(P(596, 760), P(508, 700), P(lerp(596, 402, b1), lerp(760, 654, b1))), 6]);
    if (b2 > 0) out.push([qcurve(P(644, 690), P(744, 638), P(lerp(644, 830, b2), lerp(690, 604, b2))), 6]);
    // the canopy: three lumpy masses that swell out of the top
    const cu = Math.min(1, back(win(a, 1.3, 2.15)));
    if (cu > 0) {
      out.push([blob(620, lerp(700, 306, cu), 246 * cu, 4), 6]);
      out.push([blob(404, lerp(700, 430, cu), 138 * cu, 8), 6]);
      out.push([blob(842, lerp(700, 404, cu), 126 * cu, 12), 6]);
    }
    // the apple: forms on the low branch, hangs, drops, bonks him, rolls off
    const app = win(a, 2.05, 2.35);
    if (app > 0) {
      const fall = win(a, 2.8, 3.12), roll = win(a, 3.12, 3.9);
      const hx = 412, hy = 690;
      let ax = hx, ay = hy, r = 30 * Math.min(1, back(app));
      if (fall > 0) ay = lerp(hy, 700, fall * fall);                       // gravity, not a lerp
      if (roll > 0) { ax = lerp(hx, 214, easeOut(roll)); ay = lerp(696, 1006, Math.min(1, roll * 2.1)); }
      out.push([circ(ax, ay, r), 6]);
      if (fall <= 0) out.push([seg(P(ax + 4, ay - r), P(ax + 10, ay - r - 18), 3), 4]);
      if (roll > .35) { const sp = Math.sin(win(a, 3.3, 3.9) * Math.PI) * 16;   // it wobbles as it goes
        out.push([circ(ax, ay, r * .34, 10, sp, sp + 2.2), 3]); }
    }
    // him: watches it climb, gets bonked, rubs his head
    const bonked = win(a, 3.12, 3.7);
    const lean2 = bonked > 0 && bonked < 1 ? Math.sin(bonked * Math.PI * 3) * 10 * (1 - bonked) : 0;
    for (const st of man(340, 1030, {
      crouch: easeOut(win(a, 3.3, 3.7)) * .45,
      lean: lean2,
      look: a > .4 && a < 3.1 ? .6 : 0,
      arm: a > 3.35 ? 1.3 + Math.sin(a * 9) * .12 : 0,
    }).strokes) out.push(st);
    return out;
  },
  extras(a, seed) {
    const u = win(a, 3.12, 3.72);
    if (u > 0 && u < 1) for (let i = 0; i < 5; i++) {                      // the bonk, as stars
      const ang = -Math.PI / 2 + (i - 2) * .52, d = 46 + u * 74;
      og.globalAlpha = 1 - u;
      inkStroke(og, seg(P(412 + Math.cos(ang) * d * .55, 690 + Math.sin(ang) * d * .55), P(412 + Math.cos(ang) * d, 690 + Math.sin(ang) * d), 2), 5, 1, seed + i);
      og.globalAlpha = 1; }
  },
},

// --- a cat, a fishbowl, and one very quick fish ----------------------------
// The bowl goes up on a table and the cat reaches up to it from the floor.
// Side by side the two of them made a wide, short picture with half a sheet
// of empty paper above it; stacked, the same gag fills a portrait frame --
// and a cat straining up at a bowl over its head is the funnier drawing.
cat: {
  title: 'DRAW A CAT',
  caps: [['DRAW A CAT.', T.draw + .3, T.alive + .2], ['IT HAS OTHER PLANS.', T.alive + .3, T.card]],
  FLOOR: 1040, TABLE: 700, BX: 640, BY: 490, BR: 210, A0: .78,
  table(out) {
    out.push([seg(P(60, 1040), P(860, 1047), 12), 5]);                     // the floor
    out.push([seg(P(404, 700), P(900, 704), 10), 6]);                      // the table top
    out.push([seg(P(486, 704), P(496, 1040), 6), 5]);                      // legs
    out.push([seg(P(846, 704), P(858, 1040), 6), 5]);
  },
  // y grows downward, so the arc that makes the BODY of the bowl runs from
  // just above the middle on the right, down through the bottom and back up
  // the left -- increasing angle, -a0 to PI + a0. With the signs the other
  // way round it draws the shallow bottom cap and hangs the rim in mid-air
  // above it, which is a saucer, not a fishbowl.
  bowl(out) {
    const { BX: cx, BY: cy, BR: R, A0: a0 } = this;
    const rimY = cy - Math.sin(a0) * R, rimX = Math.cos(a0) * R;
    out.push([circ(cx, cy, R, 40, -a0, Math.PI + a0), 6]);                 // the body, open at the top
    out.push([ell(cx, rimY, rimX, 26), 5]);                                // the mouth
    const wy = rimY + 72, half = Math.sqrt(Math.max(0, R * R - Math.pow(cy - wy, 2)));
    out.push([[P(cx - half, wy), P(cx - half * .4, wy + 16), P(cx + half * .3, wy + 6), P(cx + half, wy + 12)], 4]);
  },
  fish(out, x, y, rot, flip = 1) {
    const R = (px, py) => { const c = Math.cos(rot), sn = Math.sin(rot); return P(x + (px * c - py * sn) * flip, y + px * sn + py * c); };
    out.push([[R(-40, 0), R(-12, -26), R(30, -8), R(48, 0), R(30, 10), R(-12, 24), R(-40, 0)], 5]);
    out.push([[R(-40, 0), R(-74, -26), R(-66, 0), R(-74, 26), R(-40, 0)], 5]);
    out.push([circ(R(28, -5).x, R(28, -5).y, 4, 8), 4]);
  },
  head(out, cx, hy, { squint = 0, xeyes = false, open = 0 } = {}) {
    out.push([blob(cx, hy, 94, 21, 34, .96), 6]);
    out.push([[P(cx - 64, hy - 68), P(cx - 78, hy - 150), P(cx - 8, hy - 90)], 5]);
    out.push([[P(cx + 64, hy - 68), P(cx + 78, hy - 150), P(cx + 8, hy - 90)], 5]);
    if (xeyes) for (const ex of [cx - 31, cx + 31]) {
      out.push([seg(P(ex - 14, hy - 28), P(ex + 14, hy), 2), 5]);
      out.push([seg(P(ex - 14, hy), P(ex + 14, hy - 28), 2), 5]); }
    else for (const ex of [cx - 31, cx + 31]) {
      if (squint > .5) out.push([qcurve(P(ex - 14, hy - 10), P(ex, hy - 22), P(ex + 14, hy - 10)), 5]);
      else out.push([circ(ex, hy - 13, 6, 10), 5]); }
    out.push([[P(cx - 10, hy + 14), P(cx, hy + 24), P(cx + 10, hy + 14)], 4]);
    if (open > 0) out.push([ell(cx, hy + 42, 18 * open, 15 * open, 14), 4]);
    for (const d of [-1, 1]) { out.push([seg(P(cx + d * 32, hy + 18), P(cx + d * 100, hy + 6), 3), 3]);
      out.push([seg(P(cx + d * 32, hy + 30), P(cx + d * 98, hy + 38), 3), 3]); }
  },
  body(out, x, y) { out.push([smooth([P(x - 124, y + 10), P(x - 98, y - 88), P(x, y - 114), P(x + 102, y - 80), P(x + 126, y + 16), P(x + 62, y + 98), P(x - 68, y + 98)], 7), 6]); },
  still() {
    const out = [];
    this.table(out);
    this.body(out, 236, 900);
    this.head(out, 236, 688, {});
    out.push([qcurve(P(118, 906), P(28, 812), P(66, 996)), 6]);            // tail
    out.push([smooth([P(320, 940), P(356, 1000), P(384, 1038)], 6, false), 6]);   // front leg, down
    out.push([ell(392, 1038, 26, 13), 5]);
    this.bowl(out);
    this.fish(out, this.BX, 540, .1);
    return out;
  },
  live(a) {
    const out = [];
    this.table(out);
    const reach = easeOut(win(a, .5, 1.5)) * (1 - easeOut(win(a, 2.3, 2.5)));
    const slap = win(a, 2.3, 2.55);
    const recoil = Math.sin(Math.min(1, win(a, 2.35, 3.2)) * Math.PI);
    const lean = reach * 30 - recoil * 66;
    const cx = 236 + lean, hy = 688 - reach * 34 + recoil * 34;
    this.body(out, 236 + lean * .3, 900 - reach * 12);
    const tw = Math.sin(a * 7) * (a < 2.3 ? 30 : 10);
    out.push([qcurve(P(118, 906), P(28 - tw * .4, 812 - tw), P(66, 996 + tw)), 6]);
    this.head(out, cx, hy, { xeyes: slap > .4 && a < 3.6, squint: reach, open: slap > .4 ? Math.min(1, recoil * 1.4) : 0 });
    // the front leg stretches up over the rim and dips in -- cats are elastic
    const rimY = this.BY - Math.sin(this.A0) * this.BR;
    const px = lerp(392, 566, reach), py = lerp(1038, rimY + 66, reach) - Math.sin(reach * Math.PI) * 90;
    out.push([smooth([P(320 + lean * .6, 940), P(lerp(356, 470, reach), lerp(1000, 760, reach) - Math.sin(reach * Math.PI) * 60), P(px, py)], 8, false), 6]);
    out.push([ell(px + 6, py, 26, 14), 5]);
    this.bowl(out);
    // the fish: idling, then out over the rim and down onto the cat, then home
    const jump = win(a, 1.75, 2.45), home = win(a, 2.55, 3.35);
    if (home > 0) { const u = easeOut(home);
      this.fish(out, lerp(cx + 96, this.BX, u), lerp(hy - 8, 540, u) - Math.sin(u * Math.PI) * 190, lerp(-.5, .5, u), -1);
    } else if (jump > 0) {
      this.fish(out, lerp(this.BX, cx + 96, jump), lerp(540, hy - 8, jump) - Math.sin(jump * Math.PI) * 150, lerp(.1, -.8, jump));
    } else {
      this.fish(out, this.BX + Math.sin(a * 5) * 26, 546 + Math.cos(a * 3) * 12, .1 + Math.sin(a * 5) * .12);
    }
    return out;
  },
  extras(a, seed) {
    const u = win(a, 2.3, 2.75);
    if (u > 0 && u < 1) { const cx = 236 + 30, cy = 660;                   // the slap
      for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2, d0 = 42 + u * 48, d1 = 84 + u * 116;
        og.globalAlpha = 1 - u;
        inkStroke(og, seg(P(cx + Math.cos(ang) * d0, cy + Math.sin(ang) * d0), P(cx + Math.cos(ang) * d1, cy + Math.sin(ang) * d1), 2), 5, 1, seed + i);
        og.globalAlpha = 1; } }
    const sp = win(a, 3.25, 3.85);                                          // the splash going home
    const rimY = this.BY - Math.sin(this.A0) * this.BR;
    if (sp > 0 && sp < 1) for (let i = 0; i < 7; i++) { const ang = -Math.PI / 2 + (i - 3) * .3, d = 40 + sp * 96;
      og.globalAlpha = 1 - sp;
      inkStroke(og, seg(P(this.BX + Math.cos(ang) * d * .5, rimY + Math.sin(ang) * d * .5), P(this.BX + Math.cos(ang) * d, rimY + Math.sin(ang) * d), 2), 4, 1, seed + 30 + i);
      og.globalAlpha = 1; }
  },
},

// --- a very small lizard, briefly ------------------------------------------
rex: {
  title: 'DRAW A LIZARD',
  caps: [['DRAW SOMETHING SMALL.', T.draw + .3, T.alive + .2], ["IT DOESN'T STAY SMALL.", T.alive + .3, T.card]],
  GY: 1030,
  /** One reptile, any size. s scales it about its feet; jaw opens the mouth. */
  dino(out, x, gy, s, { jaw = 0, phase = 0, run = 0 } = {}) {
    const f = (dx, dy) => P(x + dx * s, gy + dy * s);
    const bob = Math.sin(phase) * 5 * run;
    const by = -86 + bob;
    out.push([smooth([f(-58, by + 4), f(-20, by - 28), f(30, by - 20), f(62, by + 4), f(34, by + 34), f(-24, by + 36)], 7), 6 * s]);
    const hx = 100, hy = by - 68 + bob * .5;
    out.push([smooth([f(44, by - 14), f(78, by - 46), f(hx - 14, hy + 16)], 7, false), 6 * s]);   // neck
    out.push([smooth([f(hx - 20, hy + 12), f(hx - 14, hy - 20), f(hx + 42, hy - 18), f(hx + 64, hy + 2)], 6), 6 * s]);
    const j = jaw * .6;
    const jp = (dx, dy) => { const ox = hx + 2, oy = hy + 8, c = Math.cos(j), sn = Math.sin(j);
      return f(ox + (dx * c - dy * sn), oy + (dx * sn + dy * c)); };
    out.push([[jp(0, 0), jp(34, 10), jp(58, 4)], 6 * s]);                               // jaw
    if (jaw > .25) for (let i = 0; i < 3; i++) {
      out.push([[f(hx + 10 + i * 17, hy + 10), f(hx + 16 + i * 17, hy + 26)], 4 * s]);
      out.push([[jp(10 + i * 17, 3), jp(15 + i * 17, -13)], 4 * s]); }
    out.push([circ(f(hx + 18, hy - 6).x, f(hx + 18, hy - 6).y, 5 * s, 10), 5 * s]);     // eye
    out.push([smooth([f(-58, by + 4), f(-114, by - 20), f(-170, by + 18), f(-206, by + 4)], 8, false), 6 * s]);  // tail
    out.push([smooth([f(36, by + 10), f(62, by + 24), f(50, by + 40)], 6, false), 4 * s]);      // the famous little arm
    const leg = (ox, ph) => { const swing = Math.sin(ph) * 32 * run, lift = Math.max(0, Math.cos(ph)) * 22 * run;
      out.push([smooth([f(ox, by + 28), f(ox + swing * .4 + 12, -44), f(ox + swing, -lift - 4), f(ox + swing + 30, -lift)], 7, false), 6 * s]); };
    leg(6, phase); leg(-30, phase + Math.PI);
  },
  still() {
    const out = [];
    out.push([seg(P(70, 962), P(850, 969), 12), 5]);
    for (const st of man(772, 962).strokes) out.push(st);
    this.dino(out, 262, 962, .30, { jaw: .1 });
    return out;
  },
  live(a) {
    const out = [];
    out.push([seg(P(70, 962), P(850, 969), 12), 5]);
    const s = lerp(.30, 2.70, easeOut(win(a, .3, 1.5)));
    const roar = win(a, 1.55, 2.05);
    const jaw = roar > 0 && roar < 1 ? Math.sin(roar * Math.PI) : (a > 2.05 ? .28 + Math.sin(a * 9) * .12 : .1);
    const chase = easeOut(win(a, 2.0, 3.5));
    this.dino(out, lerp(262, 548, chase), 962, s, { jaw, phase: a * 12, run: a > 2.0 && a < 3.5 ? 1 : 0 });
    // he watches it grow, then legs it off the right edge
    const flee = easeOut(win(a, 1.75, 3.3));
    const mx = lerp(772, 1010, flee);
    if (mx < 968) for (const st of man(mx, 962, {
      run: a > 1.75 ? 1 : 0, phase: a * 15, lean: flee * 16,
      look: a < 1.8 ? -1 : 0, arm: a > 1.75 ? 1.15 : 0,
    }).strokes) out.push(st);
    return out;
  },
  extras(a, seed) {
    const roar = win(a, 1.55, 2.2);
    if (roar > 0 && roar < 1) { const ox = 262 + 300, oy = 962 - 470;     // the roar, off the snout
      for (let i = 0; i < 6; i++) { const ang = (i - 2.5) * .2, d0 = 40 + roar * 80, d1 = 110 + roar * 210;
        og.globalAlpha = (1 - roar) * .9;
        inkStroke(og, seg(P(ox + Math.cos(ang) * d0, oy + Math.sin(ang) * d0), P(ox + Math.cos(ang) * d1, oy + Math.sin(ang) * d1), 2), 5, 1, seed + i);
        og.globalAlpha = 1; } }
    if (a > 2.1 && a < 3.6) { const r = rng(Math.floor(a * 10) + 5);       // dust
      for (let i = 0; i < 4; i++) { const px = 260 + r() * 400, pu = r();
        og.globalAlpha = .45 - pu * .35;
        inkStroke(og, circ(px, 954 - pu * 34, 8 + pu * 14, 10), 3, 1, seed + 40 + i);
        og.globalAlpha = 1; } }
  },
},

// --- an egg, and what comes out of it -------------------------------------
egg: {
  title: 'DRAW AN EGG',
  caps: [['DRAW AN EGG.', T.draw + .3, T.alive + .2], ['WAIT FOR IT.', T.alive + .3, T.alive + 2.95], ['…BYE.', T.alive + 3.05, T.card]],
  EX: 540, GY: 1030, RX: 122, RY: 160,
  /** The shell as points, tip up. rot tips it about the point it stands on. */
  shell(rot = 0) {
    const { EX, GY, RX, RY } = this, cy = GY - RY, c = Math.cos(rot), sn = Math.sin(rot);
    return Array.from({ length: 41 }, (_, i) => { const a = i / 40 * Math.PI * 2;
      const x = RX * Math.cos(a) * (1 - .22 * Math.sin(a)), y = -RY * Math.sin(a);
      const px = x, py = y - RY;                          // about the base: y runs -2RY..0
      return P(EX + px * c - py * sn, GY + px * sn + py * c); });
  },
  bird(out, x, gy, s, { flap = 0, air = 0, look = 0 } = {}) {
    const f = (dx, dy) => P(x + dx * s, gy + dy * s);
    out.push([ell(x, gy - 44 * s, 46 * s, 34 * s), 5]);                                   // body
    out.push([circ(f(26, -84).x, f(26, -84).y, 24 * s), 5]);                              // head
    out.push([[f(46, -88), f(66, -80), f(46, -74)], 4]);                                  // beak
    out.push([circ(f(32, -90).x, f(32, -90).y, 3 * s, 8), 4]);                            // eye
    const w = Math.sin(flap) * 1.1;                                                       // the wing
    out.push([smooth([f(-6, -56), f(-30, -56 - 44 * Math.cos(w)), f(-52, -50 - 70 * Math.cos(w) * .8)], 6, false), 5]);
    out.push([[f(-40, -40), f(-64, -30), f(-60, -50)], 4]);                               // tail
    if (air < .5) { out.push([[f(-8, -12), f(-10, 0)], 4]); out.push([[f(12, -12), f(14, 0)], 4]); }   // legs
  },
  still() {
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);
    for (const st of man(280, 1030).strokes) out.push(st);
    out.push([this.shell(), 6]);
    out.push([qcurve(P(460, 1034), P(540, 1050), P(620, 1034)), 4]);                      // a little nest line
    return out;
  },
  live(a) {
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);
    out.push([qcurve(P(460, 1034), P(540, 1050), P(620, 1034)), 4]);
    const { EX, GY, RY } = this;
    // it wobbles, cracks, and the top comes off
    const wob = Math.sin(a * 24) * .13 * Math.sin(Math.min(1, win(a, .2, 1.05)) * Math.PI);
    const crack = win(a, 1.0, 1.3), pop = back(win(a, 1.25, 1.6));
    const crackY = GY - RY - 6;
    const pts = this.shell(wob);
    if (pop < .01) { out.push([pts, 6]); }
    else {
      const bottom = pts.filter(p => p.y >= crackY), top = pts.filter(p => p.y < crackY);
      out.push([bottom, 6]);
      const cx = EX + 34 * pop, cy = crackY - 40 - 70 * Math.min(1, pop), rot = .55 * Math.min(1, pop);
      const c = Math.cos(rot), sn = Math.sin(rot);
      out.push([top.map(p => { const dx = p.x - EX, dy = p.y - crackY; return P(cx + dx * c - dy * sn, cy + 40 + dx * sn + dy * c); }), 6]);
    }
    if (crack > 0) { const zig = []; for (let i = 0; i <= 8; i++) zig.push(P(EX - 116 + i * 29, crackY + (i % 2 ? 14 : -14)));
      out.push([zig, 4 * Math.min(1, crack * 2 + .3)].map((v, i) => i ? v : v.slice(0, Math.max(2, Math.ceil(9 * crack))))); }
    // the chick: peeks, hops out, grows in three beats, then goes
    const peek = back(win(a, 1.35, 1.6)), hop = easeOut(win(a, 1.6, 1.95));
    const grow = 1.3 + .3 * back(win(a, 1.95, 2.15)) + .35 * back(win(a, 2.3, 2.5)) + .4 * back(win(a, 2.65, 2.85));
    const fly = easeOut(win(a, 3.05, 3.75));
    if (peek > 0) {
      const bx = lerp(EX, 780, hop), gy = lerp(crackY + 20, GY, hop) - Math.sin(hop * Math.PI) * 110 - fly * fly * 1700;
      const sz = peek < 1 ? .9 * peek : lerp(.9, 1.3, hop) * grow / 1.3;
      if (gy > -200) this.bird(out, bx, gy, sz, { flap: a > 2.95 ? a * 26 : 0, air: fly });
    }
    // one feather, drifting down to him
    const fe = win(a, 3.4, 4.2);
    if (fe > 0) { const fx = 640 - fe * 330 + Math.sin(fe * 9) * 34, fy = lerp(360, 728, fe);
      out.push([smooth([P(fx - 20, fy + 10), P(fx, fy - 12), P(fx + 24, fy + 6)], 6, false), 4]);
      out.push([[P(fx - 20, fy + 10), P(fx + 24, fy + 6)], 3]); }
    for (const st of man(280, 1030, { look: a > 1.2 ? .7 : 0, arm: a > 3.0 ? .95 : (a > 1.3 ? .3 : 0) }).strokes) out.push(st);
    return out;
  },
  extras(a, seed) {
    const w = win(a, 3.05, 3.5);                                                          // the take-off, as motion lines
    if (w > 0 && w < 1) for (let i = 0; i < 4; i++) { og.globalAlpha = (1 - w) * .8;
      inkStroke(og, seg(P(750 + i * 24, 1000 - w * 520 - i * 40), P(750 + i * 24, 1000 - w * 520 - i * 40 - 70), 2), 3, 1, seed + i); og.globalAlpha = 1; }
  },
},

// --- a frog, a fly, and a tongue with poor aim -------------------------------
frog: {
  title: 'DRAW A FROG',
  caps: [['DRAW A FROG.', T.draw + .3, T.alive + .2], ['GOOD LUCK, FROG.', T.alive + .3, T.card]],
  FX: 460, GY: 1040,
  flyAt(a) { return P(520 + Math.sin(a * 3) * 130, 320 + Math.sin(a * 6) * 40); },
  frog(out, { pupil = P(0, 0), cross = 0, gulp = 0, blink = 0, mouth = 0 } = {}) {
    const { FX, GY } = this;
    out.push([blob(FX, GY - 116, 178, 31, 40, .68), 6]);                                  // body
    out.push([circ(FX, GY - 70 + gulp * 6, 30 * gulp, 14), 4].map((v, i) => i ? v : (gulp > .05 ? v : v.slice(0, 2))));   // the gulp
    out.push([qcurve(P(FX - 120, GY - 126), P(FX, GY - 70 + mouth * 34), P(FX + 120, GY - 126)), 5]);   // mouth
    for (const d of [-1, 1]) {                                                            // eyes on top
      const ex = FX + d * 76, ey = GY - 250;
      if (blink > .5) out.push([qcurve(P(ex - 36, ey), P(ex, ey + 10), P(ex + 36, ey)), 5]);
      else { out.push([circ(ex, ey, 42), 5]);
        const px = cross ? -d * 10 : pupil.x, py = cross ? -8 : pupil.y;
        out.push([circ(ex + px, ey + py, 11, 10), 6]); }
      out.push([smooth([P(FX + d * 140, GY - 70), P(FX + d * 220, GY - 34), P(FX + d * 186, GY), P(FX + d * 254, GY)], 6, false), 5]);   // leg
    }
  },
  fly(out, x, y, a) {
    out.push([ell(x, y, 11, 8, 12), 4]);
    const w = Math.sin(a * 60) * .5;
    out.push([qcurve(P(x - 4, y - 6), P(x - 20, y - 26 - w * 10), P(x - 8, y - 8)), 3]);
    out.push([qcurve(P(x + 4, y - 6), P(x + 20, y - 26 + w * 10), P(x + 8, y - 8)), 3]);
  },
  still() {
    const out = [];
    out.push([seg(P(60, 1040), P(860, 1047), 12), 5]);
    out.push([qcurve(P(60, 1010), P(180, 990), P(260, 1040)), 4]);                        // a lily leaf edge
    this.frog(out, { pupil: P(6, -4) });
    this.fly(out, 520, 320, 0);
    return out;
  },
  live(a) {
    const out = [];
    out.push([seg(P(60, 1040), P(860, 1047), 12), 5]);
    out.push([qcurve(P(60, 1010), P(180, 990), P(260, 1040)), 4]);
    const { FX, GY } = this;
    const mouth = P(FX, GY - 110);
    // beats: watch .0-.8, shot 1 .8-1.3 (miss), fly lands on its head 1.6, cross-eyed, shot 2 2.3-2.9, gulp 3.0
    const shot1 = win(a, .8, 1.0), back1 = win(a, 1.05, 1.35);
    const shot2 = win(a, 2.3, 2.55), back2 = win(a, 2.6, 2.9);
    let fly = this.flyAt(a), onHead = false;
    if (a >= .72 && a < 1.5) { const u = easeOut(win(a, .72, .9)); fly = P(lerp(this.flyAt(.72).x, 250, u), lerp(this.flyAt(.72).y, 460, u) + Math.sin(a * 20) * 6); }
    else if (a >= 1.5 && a < 2.6) { const u = easeOut(win(a, 1.5, 1.75)); fly = P(lerp(250, FX, u), lerp(460, GY - 300, u)); onHead = a > 1.7; }
    else if (a >= 2.6) fly = null;                                                        // it has been dealt with
    const target = fly || P(FX, GY - 300);
    const look = P(Math.max(-16, Math.min(16, (target.x - FX) * .06)), Math.max(-16, Math.min(16, (target.y - (GY - 250)) * .06)));
    const gulp = Math.sin(Math.min(1, win(a, 2.95, 3.35)) * Math.PI);
    this.frog(out, { pupil: look, cross: onHead ? 1 : 0, gulp, blink: a > 3.55 && a < 3.75 ? 1 : 0, mouth: shot1 > 0 && back1 < 1 || shot2 > 0 && back2 < 1 ? 1 : 0 });
    // the tongue: straight up and a miss, then curled back over its own head
    if (shot1 > 0 && back1 < 1) { const u = shot1 * (1 - back1), tip = P(lerp(mouth.x, 520, u), lerp(mouth.y, 330, u));
      out.push([seg(mouth, tip, 12), 9]); out.push([circ(tip.x, tip.y, 16, 12), 6]); }
    if (shot2 > 0 && back2 < 1) { const u = shot2 * (1 - back2), path = qcurve(mouth, P(FX + 290, GY - 340), P(FX + 10, GY - 310), 24);
      const n = Math.max(2, Math.ceil(path.length * u)); const tip = path[n - 1];
      out.push([path.slice(0, n), 9]); out.push([circ(tip.x, tip.y, 16, 12), 6]);
      if (back2 > 0) fly = null; else if (u > .9) fly = P(tip.x, tip.y - 8); }
    if (fly && !(back2 > 0)) this.fly(out, fly.x, fly.y, a);
    return out;
  },
  extras(a, seed) {
    const m = win(a, 1.0, 1.4);                                                           // "!" at the miss
    if (m > 0 && m < 1) { og.globalAlpha = 1 - m; inkStroke(og, seg(P(560, 300 - m * 40), P(560, 250 - m * 40), 3), 6, 1, seed); inkStroke(og, circ(560, 328 - m * 40, 4, 8), 5, 1, seed + 1); og.globalAlpha = 1; }
    const z = win(a, 3.6, 4.0);                                                           // a contented "~"
    if (z > 0 && z < 1) { og.globalAlpha = 1 - z; inkStroke(og, [P(600, 760 - z * 40), P(615, 748 - z * 40), P(630, 760 - z * 40), P(645, 748 - z * 40)], 4, 1, seed + 2); og.globalAlpha = 1; }
  },
},

// --- a rocket, and the ground it left turning into a planet ------------------
// The camera is inside the drawing: as the rocket climbs, everything scales
// about the launch site until the flat ground it stood on is a small ball
// at the bottom of the page and the sky is stars.
rocket: {
  title: 'DRAW A ROCKET',
  caps: [['DRAW A ROCKET.', T.draw + .3, T.alive + .2], ['3… 2… 1…', T.alive + .25, T.alive + .95], ['WATCH IT GO.', T.alive + 1.0, T.card]],
  STARS: (() => { const r = rng(77); return Array.from({ length: 16 }, () => ({ x: 60 + r() * 800, y: 40 + r() * 620, s: 5 + r() * 7, t: r() })); })(),
  rocket(out, x, base, s, { flame = 0, jitter = 0 } = {}) {
    const f = (dx, dy) => P(x + (dx + jitter) * s, base + dy * s);
    out.push([smooth([f(-30, 0), f(-32, -160), f(0, -250), f(32, -160), f(30, 0)], 8, false), 6 * s]);
    out.push([[f(-30, 0), f(30, 0)], 5 * s]);
    out.push([[f(-30, -40), f(-58, 4), f(-30, -4)], 5 * s]); out.push([[f(30, -40), f(58, 4), f(30, -4)], 5 * s]);   // fins
    out.push([circ(f(0, -150).x, f(0, -150).y, 14 * s, 14), 5 * s]);                     // window
    out.push([[f(-16, 0), f(-12, 14), f(12, 14), f(16, 0)], 5 * s]);                      // nozzle
    if (flame > 0) { const k = flame * (1 + Math.sin(base * 7 + x) * .25);
      out.push([[f(-14, 14), f(-24, 14 + 40 * k), f(-6, 14 + 30 * k), f(0, 14 + 74 * k), f(6, 14 + 30 * k), f(24, 14 + 40 * k), f(14, 14)], 5 * s]); }
  },
  still() {
    const out = [];
    out.push([circ(460, 2530, 1500, 40, -Math.PI / 2 - .33, -Math.PI / 2 + .33), 5]);   // the horizon, an arc of something very big
    for (const st of man(300, 1030, { arm: 1.0 }).strokes) out.push(st);
    out.push([seg(P(540, 1030), P(544, 900)), 5]); out.push([seg(P(544, 900), P(500, 890)), 5]);   // the gantry
    out.push([seg(P(540, 960), P(500, 950)), 4]);
    this.rocket(out, 460, 1030, 1);
    return out;
  },
  live(a) {
    const out = [];
    const cd = a < .6;
    const climb = easeOut(win(a, .6, .9)), zoom = easeOut(win(a, .9, 3.2));
    const s = lerp(1, .36, zoom), ER = lerp(1500, 130, zoom), altU = lerp(0, 2.3, zoom);
    const toMoon = easeOut(win(a, 2.7, 3.6));
    const rx = lerp(460, 650, toMoon);
    const ry = lerp(lerp(1030, 950, climb), 330, zoom) + toMoon * 22;
    const earthTop = ry + altU * ER + (zoom < .02 ? 0 : 0), EY = earthTop + ER;
    // the planet, then its continents once it is small enough to have any
    out.push([circ(460, EY, ER, Math.max(48, Math.round(ER / 5))), 5]);
    if (ER < 700) { const k = Math.min(1, (700 - ER) / 400);
      out.push([blob(460 - ER * .28, EY - ER * .25, ER * .30 * k, 5, 22, .8), 4]);
      out.push([blob(460 + ER * .36, EY + ER * .30, ER * .22 * k, 9, 18, .9), 4]); }
    // the launch site: gantry and him, until they are too small to matter
    if (zoom < .55) { const gs = lerp(1, .36, zoom), gy = earthTop;
      out.push([seg(P(460 + 80 * gs, gy), P(460 + 84 * gs, gy - 130 * gs)), 5 * gs]); out.push([seg(P(460 + 84 * gs, gy - 130 * gs), P(460 + 40 * gs, gy - 140 * gs)), 5 * gs]);
      if (a < 1.3) for (const st of man(300, 1030, { arm: cd ? 1.0 : 1.0 + Math.sin(a * 12) * .1, look: cd ? 0 : .7 }).strokes) out.push(st); }
    // the moon, and a flag once it is there
    if (toMoon > 0 || a > 2.4) { const mu = back(win(a, 2.4, 2.8));
      out.push([circ(700, 250, 108 * Math.min(1, mu), 30), 6]);
      for (const [cx, cy, r] of [[668, 222, 18], [722, 274, 14], [736, 214, 10]]) out.push([circ(cx, cy, r * Math.min(1, mu), 12), 4]); }
    const landed = win(a, 3.55, 3.7);
    this.rocket(out, rx, ry, s, { flame: cd ? 0 : (landed > 0 ? 1 - landed : 1), jitter: cd ? Math.sin(a * 90) * 3 * win(a, .2, .6) : 0 });
    const fl = back(win(a, 3.65, 3.95));
    if (fl > 0) { out.push([seg(P(rx + 40, ry), P(rx + 40, ry - 96 * fl)), 4]); out.push([[P(rx + 40, ry - 96 * fl), P(rx + 40 + 64 * fl, ry - 78 * fl), P(rx + 40, ry - 58 * fl)], 4]); }
    return out;
  },
  extras(a, seed) {
    const zoom = easeOut(win(a, .9, 3.2));
    // stars come out as the sky gets big
    for (const st of this.STARS) { const u = win(zoom, .3 + st.t * .4, .6 + st.t * .4); if (u <= 0) continue;
      og.globalAlpha = u; inkStroke(og, [P(st.x - st.s, st.y), P(st.x + st.s, st.y)], 3, 1, seed); inkStroke(og, [P(st.x, st.y - st.s), P(st.x, st.y + st.s)], 3, 1, seed + 1); og.globalAlpha = 1; }
    // smoke at the launch
    if (a > .4 && a < 2.0 && zoom < .3) { const r = rng(Math.floor(a * 10) + 3);
      for (let i = 0; i < 6; i++) { const u = r(), age = win(a, .4 + u * .6, 1.6 + u * .6); if (age <= 0 || age >= 1) continue;
        og.globalAlpha = (1 - age) * .6; inkStroke(og, circ(460 + (r() - .5) * 200 * (1 + age), 1030 - age * 40 * (1 - zoom), (14 + age * 40) * (1 - zoom * .8), 12), 3, 1, seed + 10 + i); og.globalAlpha = 1; } }
  },
},

// --- a giraffe, and a page that is not tall enough for it --------------------
giraffe: {
  title: 'DRAW A GIRAFFE',
  caps: [['DRAW A GIRAFFE.', T.draw + .3, T.alive + .2], ['THE PAGE IS TOO SMALL.', T.alive + .3, T.alive + 2.0], ['…HELLO.', T.alive + 2.1, T.card]],
  GY: 1030,
  head(out, cx, cy, rot = 0, { tongue = 0 } = {}) {
    const k = 1.45, c = Math.cos(rot), sn = Math.sin(rot), f = (dx, dy) => P(cx + (dx * c - dy * sn) * k, cy + (dx * sn + dy * c) * k);
    out.push([smooth([f(-58, 0), f(-30, -34), f(40, -30), f(74, -6), f(50, 26), f(-30, 32)], 6), 6]);
    out.push([circ(f(24, -8).x, f(24, -8).y, 7, 8), 5]);                                  // eye
    out.push([[f(-24, -30), f(-30, -70), f(-18, -74)], 4]); out.push([[f(4, -30), f(0, -70), f(12, -74)], 4]);   // ossicones
    out.push([[f(-48, -18), f(-80, -34), f(-60, -4)], 4]);                                // ear
    if (tongue > 0) out.push([smooth([f(70, 6), f(96 + 40 * tongue, 30 + 40 * tongue), f(80, 50 + 60 * tongue)], 6, false), 5]);
  },
  body(out) {
    out.push([ell(660, 810, 140, 82), 6]);
    for (const x of [560, 600, 720, 760]) out.push([seg(P(x, 880), P(x + 4, 1030), 4), 6]);
    out.push([smooth([P(524, 790), P(486, 850), P(500, 900)], 6, false), 5]);             // tail
    for (const [x, y, r] of [[620, 790, 22], [690, 830, 26], [730, 780, 18], [590, 840, 16]]) out.push([blob(x, y, r, x, 12), 4]);
  },
  still() {
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);
    for (const st of man(240, 1030).strokes) out.push(st);
    this.body(out);
    out.push([seg(P(760, 740), P(790, 480), 6), 6]); out.push([seg(P(800, 748), P(830, 486), 6), 6]);   // the neck
    this.head(out, 830, 450, -.3);
    return out;
  },
  live(a) {
    const out = [];
    out.push([seg(P(70, 1030), P(850, 1037), 12), 5]);
    this.body(out);
    // the neck climbs off the top of the page, and the head with it
    const up = easeOut(win(a, .25, 1.5));
    const topY = lerp(480, -420, up);
    out.push([seg(P(760, 740), P(790 + up * 20, topY), 10), 6]); out.push([seg(P(800, 748), P(830 + up * 20, topY + 6), 10), 6]);
    for (let i = 0; i < 6; i++) { const y = lerp(720, topY + 60, (i + .5) / 6); if (y > -40) out.push([blob(796 + up * 14, y, 14, 30 + i, 10), 3]); }
    if (topY > -80) this.head(out, 830 + up * 20, topY - 30, -.3 - up * .9);
    // then it comes back down on the other side, upside down, next to him
    const down = easeOut(win(a, 2.0, 2.8));
    if (down > 0) { const hy = lerp(-120, 600, down);
      out.push([seg(P(300, -60), P(296, hy - 20), 10), 6]); out.push([seg(P(340, -60), P(336, hy - 14), 10), 6]);
      for (let i = 0; i < 5; i++) { const y = lerp(-20, hy - 60, (i + .5) / 5); if (y > -40) out.push([blob(318, y, 14, 50 + i, 10), 3]); }
      this.head(out, 322, hy + 20, Math.PI + .25, { tongue: Math.sin(Math.min(1, win(a, 3.0, 3.5)) * Math.PI) }); }
    const licked = win(a, 3.15, 3.4);
    for (const st of man(240, 1030, { look: a > .4 && a < 2.0 ? .8 : (a > 2.4 ? -.4 : 0), lean: licked * 34, arm: a > 2.5 ? .6 : 0 }).strokes) out.push(st);
    return out;
  },
  extras(a, seed) {
    const q = win(a, 1.6, 2.1);                                                           // "?" while the head is gone
    if (q > 0 && q < 1) { og.globalAlpha = Math.sin(q * Math.PI); inkStroke(og, [P(230, 690), P(236, 672), P(252, 664), P(264, 674), P(256, 690), P(248, 700), P(248, 712)], 4, 1, seed); inkStroke(og, circ(248, 726, 3, 8), 4, 1, seed + 1); og.globalAlpha = 1; }
    const e = win(a, 3.15, 3.6);                                                          // "!" at the lick
    if (e > 0 && e < 1) { og.globalAlpha = 1 - e; inkStroke(og, seg(P(200, 700 - e * 30), P(200, 650 - e * 30), 3), 6, 1, seed + 2); inkStroke(og, circ(200, 722 - e * 30, 4, 8), 5, 1, seed + 3); og.globalAlpha = 1; }
  },
},

// --- fishing, and catching rather more than he meant to ----------------------
whale: {
  title: 'GO FISHING',
  caps: [['DRAW A FISHERMAN.', T.draw + .3, T.alive + .2], ['SOMETHING BIT.', T.alive + .3, T.alive + 2.4], ['SOMETHING BIG.', T.alive + 2.5, T.card]],
  SEA: 430, TIP: P(430, 300),
  pier(out, shake = 0) {
    out.push([seg(P(40, 380 + shake), P(380, 384 + shake), 10), 6]);
    for (const x of [90, 220, 350]) out.push([seg(P(x, 384 + shake), P(x + 2, 470), 4), 5]);
    for (let i = 0; i < 5; i++) out.push([seg(P(60 + i * 64, 372 + shake), P(60 + i * 64, 392 + shake), 2), 3]);
  },
  sea(out, a = 0) {
    const pts = []; for (let i = 0; i <= 18; i++) { const x = 40 + i * 46; pts.push(P(x, this.SEA + Math.sin(i * 1.3 + a * 3) * 6)); }
    out.push([pts, 5]);
  },
  hook(out, x, y) { out.push([smooth([P(x, y - 20), P(x, y + 10), P(x + 14, y + 16), P(x + 20, y)], 6, false), 4]); },
  whale(out, y, { mouth = 0, spout = 0 } = {}) {
    out.push([smooth([P(330, y - 150), P(500, y - 230), P(750, y - 180), P(880, y - 40), P(830, y + 120), P(580, y + 170), P(380, y + 110), P(300, y)], 8), 7]);
    out.push([smooth([P(300, y), P(180, y + 40), P(120, y - 30), P(150, y + 80), P(200, y + 90)], 6, false), 6]);   // tail
    out.push([circ(770, y - 110, 8, 10), 5]);                                             // eye
    out.push([qcurve(P(872, y - 30), P(700, y + 40 + mouth * 60), P(520, y + 60)), 6]);   // mouth
    for (let i = 0; i < 6; i++) out.push([seg(P(560 + i * 48, y + 50 + mouth * 22), P(564 + i * 48, y + 30 + mouth * 40), 2), 3]);   // baleen
    if (spout > 0) for (let i = 0; i < 5; i++) { const ang = -Math.PI / 2 + (i - 2) * .32, d = 60 + spout * 150;
      out.push([seg(P(640 + Math.cos(ang) * 30, y - 224), P(640 + Math.cos(ang) * d, y - 224 + Math.sin(ang) * d * .8), 4), 4]); }
  },
  still() {
    const out = [];
    this.sea(out);
    this.pier(out);
    for (const st of man(250, 380, { arm: 1.35 }).strokes) out.push(st);
    out.push([seg(P(294, 250), this.TIP, 6), 5]);                                         // the rod
    out.push([seg(this.TIP, P(430, 900), 10), 2]);                                        // the line
    this.hook(out, 430, 900);
    return out;
  },
  live(a) {
    const out = [];
    this.sea(out, a);
    // a nibble, a flight, and then the sea comes up to meet him
    const rise = easeOut(win(a, 1.1, 2.4));
    const wy = lerp(1420, 740, rise);
    const taut = win(a, 2.35, 2.5), yank = easeOut(win(a, 2.5, 2.9));
    const swing = Math.sin(a * 5) * 26 * yank * (1 - win(a, 3.4, 3.75) * .7);
    this.pier(out, Math.sin(a * 40) * 4 * taut * (1 - yank));
    const spout = Math.sin(Math.min(1, win(a, 3.1, 3.7)) * Math.PI);
    this.whale(out, wy, { mouth: Math.min(1, rise * 1.4), spout });
    // the small fish: in, a nibble, and gone at the first sight of that
    if (a < 1.3) { const fx = a < .8 ? lerp(140, 400, easeOut(win(a, 0, .8))) : lerp(400, -80, easeOut(win(a, 1.05, 1.3)));
      const fy = 890 + Math.sin(a * 8) * 8;
      out.push([[P(fx - 24, fy), P(fx - 6, fy - 14), P(fx + 18, fy - 4), P(fx + 26, fy), P(fx + 18, fy + 6), P(fx - 6, fy + 14), P(fx - 24, fy)], 4]);
      out.push([[P(fx - 24, fy), P(fx - 42, fy - 14), P(fx - 38, fy), P(fx - 42, fy + 14), P(fx - 24, fy)], 4]); }
    // him: on the pier, then dangling from his own rod over the thing
    const mx = lerp(250, 410, yank), my = lerp(380, 352, yank) + swing;
    for (const st of man(mx, my, { arm: 1.35 + yank * .5, lean: yank * 40, look: a > 1.3 ? .9 : 0 }).strokes) out.push(st);
    const hand = P(mx + 44 + yank * 30, my - 130 - yank * 60);
    const tip = yank > 0 ? P(lerp(430, 480, yank), lerp(300, 300, yank) + swing * .5) : this.TIP;
    out.push([seg(hand, tip, 6), 5]);
    const end = rise > 0 ? P(lerp(430, 860, Math.min(1, rise * 1.3)), Math.min(900, lerp(900, wy - 30, Math.min(1, rise * 1.3)))) : P(430, 900);
    out.push([seg(tip, end, 10), 2]);
    if (rise < .8) this.hook(out, end.x, end.y);
    return out;
  },
  extras(a, seed) {
    const r = win(a, 1.6, 2.5);                                                           // the surface heaving
    if (r > 0 && r < 1) for (let i = 0; i < 4; i++) { og.globalAlpha = (1 - r) * .8; inkStroke(og, circ(560, this.SEA, 60 + i * 50 + r * 120, 22, Math.PI + .3, Math.PI * 2 - .3), 3, 1, seed + i); og.globalAlpha = 1; }
    const sp = win(a, 2.4, 2.9);                                                          // the splash as it breaks the line
    if (sp > 0 && sp < 1) for (let i = 0; i < 8; i++) { const ang = -Math.PI / 2 + (i - 3.5) * .3, d = 40 + sp * 130;
      og.globalAlpha = 1 - sp; inkStroke(og, seg(P(600 + Math.cos(ang) * d * .5, this.SEA + Math.sin(ang) * d * .5), P(600 + Math.cos(ang) * d, this.SEA + Math.sin(ang) * d), 2), 4, 1, seed + 20 + i); og.globalAlpha = 1; }
  },
},
};

const SC = SCENES[V] || SCENES.tree;
document.getElementById('title').textContent = SC.title;

// --- the pencil's plan: the still, stroke by stroke, timed by length --------
const STILL = SC.still();
const PLAN = (() => {
  const len = s => s[0].reduce((a, p, i) => i ? a + Math.hypot(p.x - s[0][i - 1].x, p.y - s[0][i - 1].y) : 0, 0);
  const w = STILL.map(s => Math.max(30, len(s)) + 40), tot = w.reduce((a, b) => a + b, 0);
  const out = []; let t = T.draw;
  for (const [i, s] of STILL.entries()) { const dur = (w[i] / tot) * (T.drawn - T.draw - .2); out.push({ s, t0: t, t1: t + dur * .88 }); t += dur; }
  return out;
})();

// --- the slam --------------------------------------------------------------
// The pencil falls in from above the frame and hits the paper at T.slam. The
// ink it throws stays on the sheet -- specks a real pencil would leave.
const SPLAT = (() => { const r = rng(5); return Array.from({ length: 16 }, () => {
  const a = r() * Math.PI * 2, d = 40 + r() * 190;
  return { x: PW * .5 + Math.cos(a) * d, y: 560 + Math.sin(a) * d * .7, r: 2 + r() * 5, t: .04 + r() * .10 }; }); })();

function slamShake(t) {
  const u = win(t, T.slam, T.slam + .38);
  if (t < T.slam || u >= 1) return { x: 0, y: 0 };
  const k = Math.pow(1 - u, 2) * 34;
  return { x: Math.sin(t * 190) * k, y: Math.cos(t * 240) * k * .7 };
}

function paintSheet(t) {
  og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, PW, PH);
  const G = g; g = og; paintPaper(0, 0, PW, PH); g = G;
  og.strokeStyle = 'rgba(0,0,0,.06)'; og.lineWidth = 2; og.strokeRect(1, 1, PW - 2, PH - 2);
  const seed = t < T.alive ? 7 : boilSeed(t);
  // the ink the slam threw, and the blot where it landed
  if (t >= T.slam) {
    // The specks fly out hard, then settle to something faint: a pencil does
    // leave marks, but at full strength they read as dirt on the paper rather
    // than as the hit that put them there.
    const settle = lerp(1, .22, easeOut(win(t, T.slam + .3, T.slam + 1.1)));
    const b = win(t, T.slam, T.slam + .12);
    og.globalAlpha = settle; inkStroke(og, circ(PW * .5, 560, 12 * b, 12), 6, 1, 3);
    for (const sp of SPLAT) { const u = win(t, T.slam + sp.t, T.slam + sp.t + .16); if (u <= 0) continue;
      inkStroke(og, circ(lerp(PW * .5, sp.x, easeOut(u)), lerp(560, sp.y, easeOut(u)), sp.r, 10), 3, 1, 3); }
    og.globalAlpha = 1;
  }
  let tip = null;
  if (t < T.alive) {
    for (const p of PLAN) { if (t < p.t0) break; const u = win(t, p.t0, p.t1); const e = inkStroke(og, p.s[0], p.s[1], u, 7); if (u < 1) tip = e; }
  } else {
    const a = t - T.alive;
    for (const [pts, w] of SC.live(a)) inkStroke(og, pts, w, 1, seed);
    if (SC.extras) SC.extras(a, seed);
  }
  return tip;
}

function shortsFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  const sh = slamShake(t);
  g.translate(sh.x, sh.y);
  // the wall
  g.fillStyle = '#1A1630'; g.fillRect(-60, -60, W + 120, H + 120);
  const light = g.createRadialGradient(400, 300, 0, 400, 300, 1500);
  light.addColorStop(0, 'rgba(255,214,140,.22)'); light.addColorStop(1, 'rgba(255,214,140,0)');
  g.fillStyle = light; g.fillRect(0, 0, W, H);

  const tip = paintSheet(t);
  const cardU = win(t, T.card, T.card + .28);
  g.globalAlpha = 1 - cardU;
  layPaper(t);

  // the pencil: falling in, then drawing
  if (t < T.slam) {
    const u = 1 - win(t, 0, T.slam);                    // 1 at the top, 0 at the paper
    pencil(PX + PW * .5, PY + 560 - u * u * 1800, 640, -0.55 - u * .5);
  } else if (t < T.drawn && tip) {
    const u = tip.x / PW, k = breeze(t);
    const lift = (Math.sin(u * 5.2 - t * 2.1) * 8 * k + Math.sin(u * 11 - t * 3.7) * 3 * k) * Math.pow(u, 1.6);
    pencil(PX + tip.x, PY + tip.y + lift, 560, -0.85);
  }
  g.globalAlpha = 1;

  // the flash on impact
  const fl = 1 - win(t, T.slam, T.slam + .22);
  if (t >= T.slam && fl > 0) { g.fillStyle = `rgba(255,236,190,${fl * .5})`; g.fillRect(0, 0, W, H); }

  // the hook, punched on at the slam and held while the drawing starts
  const hk = back(win(t, T.slam + .02, T.slam + .3)) * (1 - win(t, T.draw + .5, T.draw + .9));
  if (hk > 0) text('DRAW ANYTHING.', 540, 190, 86, C.primary, { spacing: 6, glow: 44, scale: Math.min(1, hk), alpha: Math.min(1, hk), rot: -.02 });

  // captions under the sheet
  const cap = (s, from, to) => { const al = easeOut(win(t, from, from + .25)) * (1 - win(t, to - .25, to));
    if (al > 0) text(s, 540, 1610, 46, C.primary, { spacing: 4, alpha: al * (1 - cardU) }); };
  for (const [s, from, to] of SC.caps) cap(s, from, to);

  // the card
  if (cardU > 0) { g.globalAlpha = cardU; g.fillStyle = '#0B0920'; g.fillRect(-60, -60, W + 120, H + 120); g.globalAlpha = 1; }
  if (t >= T.card) {
    const s = back(win(t, T.card + .05, T.card + .5)), size = 300 * Math.min(1, s);
    const glow = g.createRadialGradient(540, 860, 0, 540, 860, 900);
    glow.addColorStop(0, `rgba(255,197,61,${.34 * easeOut(cardU)})`); glow.addColorStop(1, 'rgba(255,197,61,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    if (icon.complete && icon.naturalWidth) { g.save(); g.translate(540, 760); g.rotate((1 - Math.min(1, s)) * .3);
      g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 60; g.shadowOffsetY = 26;
      roundRect(-size / 2, -size / 2, size, size, size * .22); g.clip(); g.shadowColor = 'transparent';
      g.drawImage(icon, -size / 2, -size / 2, size, size); g.restore(); }
    const wu = easeOut(win(t, T.card + .3, T.card + .7));
    text('GRAND CANVAS', 540, 1010 + (1 - wu) * 30, 78, C.primary, { spacing: 7, glow: 42, alpha: wu });
    const tu = easeOut(win(t, T.card + .5, T.card + .9));
    text('Every drawing has a life in it.', 540, 1090 + (1 - tu) * 22, 38, C.text, { weight: 700, alpha: tu });
    text('a  W H O S E G A M E S  game', 540, 1700, 26, C.muted, { weight: 700, alpha: easeOut(win(t, T.card + .7, T.card + 1.1)) });
  }
  wg.style.opacity = t >= T.card ? easeOut(win(t, T.card + .7, T.card + 1.1)) : 0;
}
window.frame = shortsFrame;
prepareStage(W2, H2, { x: 496, y: 1500, size: 88 });
runPlayback(shortsFrame, T.end, [['bed', `assets/shorts_${V}_bed.mp3`, 0, .95]]);
</script>
