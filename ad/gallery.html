<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Canvas — 10s gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: center;
           transform: translate(-50%, -50%); background: #0B0920; }
  #c { position: absolute; inset: 0; }
  #wg { position: absolute; border-radius: 20px; opacity: 0;
        box-shadow: 0 10px 40px rgba(0,0,0,.5); pointer-events: none; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
           background: rgba(11,9,32,.92); color: #FFC53D; text-align: center; }
  #start b { display: block; font-size: 72px; font-weight: 900; letter-spacing: 4px; }
  #start span { display: block; margin-top: 24px; font-size: 30px; color: #9E97CE; line-height: 1.5; }
  #start kbd { color: #F6F4FF; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <img id="wg" src="assets/whosegames.gif" alt="">
  <div id="start">
    <div>
      <b>GRAND CANVAS</b>
      <span>10 second gallery &middot; ten drawings, ten cuts<br><br>
        <kbd>click</kbd> or <kbd>space</kbd> to play<br>
        <kbd>R</kbd> replay &nbsp;&middot;&nbsp; <kbd>M</kbd> mute &nbsp;&middot;&nbsp; <kbd>L</kbd> loop</span>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="drawings.js"></script>
<script>
/**
 * Ten people, ten drawings, ten cuts, ten seconds.
 *
 * Every shot drops in on somebody already a third of the way through and
 * races them to the finish, then cuts. You never watch a line start; you watch
 * ten of them land. That is what a full table actually feels like from the
 * inside -- everyone is drawing at once and you only ever catch the ends --
 * and it is the one thing the slower films can't show.
 *
 * The strip along the bottom fills as each one is finished, so the canvas is
 * visibly filling up the whole time. At 8.2s it opens out into the wall of all
 * ten, which is the name of the game.
 *
 * The cuts are locked to the music rather than the other way round: 146bpm,
 * two beats a drawing, so every finished line lands on a kick.
 */

// Must match make-music.mjs, which bakes a pen-swish onto each of these.
const BEAT = 60 / 146, CUT = BEAT * 2, CUTS = 10;
const REVEAL = CUT * CUTS;          // 8.2192 -- the wall
const RUN = 10.0;                   // engine.js already owns the name END

const KEYS = GALLERY_ORDER;
const LISTS = KEYS.map(buildDrawing);

/**
 * Each drawing is scheduled so that a chunk of it is already on the paper when
 * its shot begins and the last line lands at 0.66 of the cut -- a beat of hold
 * before the next one, which is what stops ten cuts becoming a stutter. The
 * fraction varies per drawing so they don't all arrive at the same angle.
 */
const HEADSTART = [.40, .34, .44, .37, .46, .33, .42, .36, .45, .38];
LISTS.forEach((list, i) => {
  const t0 = i * CUT, done = t0 + CUT * .66, f = HEADSTART[i];
  const span = (done - t0) / (1 - f), a = t0 - f * span;
  const len = s => s.pts.reduce((acc, p, k) => k ? acc + Math.hypot(p.x - s.pts[k-1].x, p.y - s.pts[k-1].y) : 0, 0);
  const w = list.map(s => Math.max(.06, len(s) * 2.2) + .04);
  const tot = w.reduce((x, y) => x + y, 0);
  let t = a;
  list.forEach((s, k) => { const d = (w[k] / tot) * span; s.t0 = t; s.t1 = t + d * .82; t += d; });
});

// --- finished thumbnails ----------------------------------------------------
// The strip and the wall redraw every frame, and re-stroking ten drawings ten
// times a second is a waste: paint each one once, then blit.
const THUMB = 380;
const thumbs = KEYS.map((key, i) => {
  const c = document.createElement('canvas'); c.width = c.height = THUMB;
  const main = g; g = c.getContext('2d');
  paintPaper(0, 0, THUMB, THUMB);
  for (const s of LISTS[i]) strokePath(s.pts, 1, s.color, s.width * (THUMB / 380) * .55, s.style, 0, 0, THUMB);
  g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, THUMB - 3, THUMB - 3);
  g = main;
  return c;
});

// --- geometry ---------------------------------------------------------------
const PAPER = { x: 680, y: 112, s: 560 };
const STRIP = { y: 872, s: 88, gap: 14 };
STRIP.x = (1920 - (CUTS * STRIP.s + (CUTS - 1) * STRIP.gap)) / 2;
const stripSlot = i => ({ x: STRIP.x + i * (STRIP.s + STRIP.gap), y: STRIP.y, s: STRIP.s });

const WALL = { s: 340, gap: 24 };
WALL.x = (1920 - (5 * WALL.s + 4 * WALL.gap)) / 2;
WALL.y = (1080 - (2 * WALL.s + WALL.gap)) / 2;
const wallSlot = i => ({ x: WALL.x + (i % 5) * (WALL.s + WALL.gap), y: WALL.y + Math.floor(i / 5) * (WALL.s + WALL.gap), s: WALL.s });

function shadowed(fn) {
  g.save();
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 34; g.shadowOffsetY = 14;
  fn(); g.restore();
}

// --- one shot ---------------------------------------------------------------
function shot(t, i) {
  const t0 = i * CUT, u = t - t0;
  const meta = DRAWINGS[KEYS[i]];

  // The paper snaps in rather than fading: a fade at this speed reads as a
  // glitch, a snap reads as a cut.
  const inS = 1 + .05 * (1 - easeOut(win(u, 0, .13)));
  const a = clamp(win(u, 0, .05), 0, 1) * (1 - win(u, CUT - .05, CUT));
  g.globalAlpha = a;

  // the prompt this one is answering
  promptText(960, 66, 1500, 32, 999, meta.prompt);

  const P = PAPER;
  g.save();
  g.translate(P.x + P.s / 2, P.y + P.s / 2); g.scale(inS, inS); g.translate(-(P.x + P.s / 2), -(P.y + P.s / 2));
  shadowed(() => { g.fillStyle = C.paper; g.fillRect(P.x, P.y, P.s, P.s); });
  paintPaper(P.x, P.y, P.s, P.s);
  g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(P.x + 1, P.y + 1, P.s - 2, P.s - 2);

  let tip = null;
  for (const s of LISTS[i]) {
    if (t < s.t0) break;
    const p = win(t, s.t0, s.t1);
    const e = strokePath(s.pts, p, s.color, s.width * (P.s / 380) * .55, s.style, P.x, P.y, P.s);
    if (p < 1 || t < s.t1 + .01) tip = e;
  }
  const last = LISTS[i][LISTS[i].length - 1];
  if (tip && t < last.t1) pencil(P.x + tip.x * P.s, P.y + tip.y * P.s, P.s * .5, -0.9);
  g.restore();

  // The name lands as the last line does, not before -- the drawing is the
  // joke and the caption is the punchline.
  const nu = back(win(t, last.t1 - .06, last.t1 + .20));
  if (nu > 0) {
    g.globalAlpha = a * clamp(nu, 0, 1);
    text(meta.title, 960, 748, 52, C.primary, { spacing: 3, glow: 30, scale: nu, rot: -.015 });
    g.globalAlpha = a * clamp(win(t, last.t1 + .04, last.t1 + .22), 0, 1);
    g.fillStyle = ARTIST_COLOUR[i];
    g.beginPath(); g.arc(960 - textWidth(meta.artist, 26, 3) / 2 - 22, 800, 10, 0, 7); g.fill();
    text(meta.artist, 960 + 12, 800, 26, C.text, { spacing: 3 });
  }
  g.globalAlpha = 1;
}

const ARTIST_COLOUR = [C.pink, C.cyan, C.lime, C.purple, C.primary, C.pink, C.cyan, C.lime, C.purple, C.primary];
function textWidth(str, size, spacing) {
  g.save(); g.font = `900 ${size}px Roboto, Arial, sans-serif`;
  if ('letterSpacing' in g) g.letterSpacing = `${spacing}px`;
  const w = g.measureText(str).width; g.restore(); return w;
}

// --- the strip along the bottom ---------------------------------------------
function strip(t, current) {
  for (let i = 0; i < CUTS; i++) {
    const s = stripSlot(i);
    const done = t >= LISTS[i][LISTS[i].length - 1].t1;
    if (done) {
      const pop = back(win(t, LISTS[i][LISTS[i].length - 1].t1, LISTS[i][LISTS[i].length - 1].t1 + .22));
      const k = s.s * pop, o = (s.s - k) / 2;
      g.drawImage(thumbs[i], s.x + o, s.y + o, k, k);
    } else if (i === current) {
      g.globalAlpha = .55 + .45 * Math.sin(t * 14) * .5;
      g.strokeStyle = C.primary; g.lineWidth = 3;
      roundRect(s.x, s.y, s.s, s.s, 8); g.stroke();
      g.globalAlpha = 1;
    } else {
      g.fillStyle = 'rgba(255,255,255,.05)'; roundRect(s.x, s.y, s.s, s.s, 8); g.fill();
    }
  }
  // a quiet count, so "ten people" is stated and not just implied
  const n = LISTS.filter(l => t >= l[l.length - 1].t1).length;
  text(`${n} / ${CUTS} DRAWINGS`, 960, 1005, 24, C.muted, { spacing: 5, weight: 700 });
}

// --- the wall ---------------------------------------------------------------
function wall(t) {
  const u = easeOut(win(t, REVEAL, REVEAL + .55));
  for (let i = 0; i < CUTS; i++) {
    const a = stripSlot(i), b = wallSlot(i);
    // staggered so it unfurls rather than snapping open all at once
    const k = easeOut(clamp((u * 1.45) - i * .045, 0, 1));
    const x = lerp(a.x, b.x, k), y = lerp(a.y, b.y, k), s = lerp(a.s, b.s, k);
    shadowed(() => g.drawImage(thumbs[i], x, y, s, s));
  }
  const scrim = win(t, REVEAL + .48, REVEAL + .78);
  if (scrim > 0) { g.fillStyle = `rgba(11,9,32,${.80 * scrim})`; g.fillRect(0, 0, W, H); }

  const wu = easeOut(win(t, REVEAL + .62, REVEAL + .95));
  if (wu <= 0) return;
  const glow = g.createRadialGradient(960, 500, 0, 960, 500, 820);
  glow.addColorStop(0, `rgba(255,197,61,${.26 * wu})`); glow.addColorStop(1, 'rgba(255,197,61,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  const is = back(win(t, REVEAL + .6, REVEAL + .98)), size = 190 * is;
  if (icon.complete && icon.naturalWidth) {
    g.save(); g.translate(960, 352); g.rotate((1 - is) * .3);
    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 50; g.shadowOffsetY = 20;
    roundRect(-size / 2, -size / 2, size, size, size * .22); g.clip(); g.shadowColor = 'transparent';
    g.drawImage(icon, -size / 2, -size / 2, size, size); g.restore();
  }
  text('GRAND CANVAS', 960, 530 + (1 - wu) * 30, 108, C.primary, { spacing: 9, glow: 44, alpha: wu });
  const tu = easeOut(win(t, REVEAL + .78, REVEAL + 1.1));
  text('One prompt. Ten answers. Somebody gets funded.', 960, 612, 38, C.text, { weight: 700, alpha: tu });
  const cu = back(win(t, REVEAL + .95, REVEAL + 1.4));
  if (cu > 0) {
    g.save(); g.translate(960, 738); g.scale(cu, cu); g.globalAlpha = clamp(cu, 0, 1);
    g.shadowColor = 'rgba(255,197,61,.55)'; g.shadowBlur = 46;
    g.fillStyle = C.primary; roundRect(-320, -56, 640, 112, 56); g.fill(); g.shadowColor = 'transparent';
    text('FREE ON GOOGLE PLAY', 0, 2, 38, C.onPrimary, { spacing: 3 });
    g.restore();
  }
  text('a  W H O S E G A M E S  game', 960, 1000, 24, C.muted, { weight: 700, alpha: easeOut(win(t, REVEAL + .85, REVEAL + 1.2)) });
}

// --- the frame --------------------------------------------------------------
function galleryFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const bg = g.createRadialGradient(960, 500, 0, 960, 500, 1050);
  bg.addColorStop(0, 'rgba(255,197,61,.12)'); bg.addColorStop(1, 'rgba(255,197,61,0)');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  if (t < REVEAL) {
    const i = Math.min(CUTS - 1, Math.floor(t / CUT));
    shot(t, i);
    strip(t, i);
    // A flash on the cut itself. Two frames of light is the difference between
    // a cut you feel and a cut you notice.
    const since = t - i * CUT;
    if (i > 0 && since < .07) { g.fillStyle = `rgba(255,224,138,${.22 * (1 - since / .07)})`; g.fillRect(0, 0, W, H); }
  } else {
    wall(t);
  }

  wg.style.opacity = t >= REVEAL + .8 ? easeOut(win(t, REVEAL + .85, REVEAL + 1.2)) : 0;
}
// render-mp4.sh drives frame(t) by name.
window.frame = galleryFrame;

prepareStage(1920, 1080, { x: 912, y: 880, size: 84 });
runPlayback(galleryFrame, RUN, [['bed', 'assets/rapid_bed.mp3', 0, .95]]);
</script>
</body>
</html>
