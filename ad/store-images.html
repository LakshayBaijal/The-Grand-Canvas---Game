<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand Canvas — store images</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: center;
           transform: translate(-50%, -50%); background: #0B0920; }
  #c { position: absolute; inset: 0; }
  #wg, #start { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><img id="wg" alt=""><div id="start"></div></div>

<script src="engine.js"></script>
<script src="drawings.js"></script>
<script>
/**
 * The Play Store listing images. `?shot=1` .. `?shot=5`; make-store-images.sh
 * screenshots each one.
 *
 * These are posters, and they are allowed to shout -- huge type, rays, glow,
 * confetti, gold on violet, everything tilted and lit. What they are not
 * allowed to do is show a game that doesn't exist. Play's policy requires
 * store graphics to represent actual functionality, it is enforced hard on
 * games, and a rejection arrives exactly when you are trying to launch. The
 * slower version is worse: faked screenshots buy installs and then collect
 * one-star "not what the pictures showed" reviews, and Play ranks on retention
 * and rating, so the spike sinks inside a fortnight.
 *
 * So every drawing, every number and every piece of UI below is the real
 * thing, pulled from drawings.js and the server's own constants -- $1,800 a
 * round, a $1,000 goal, 30 trophies for first, ten to a room, 405 daily
 * prompts, 161 round prompts. The loudness is all in the composition.
 */

// --- flash --------------------------------------------------------------
/** Wedges radiating from a point. The cheapest way to make a thing look like
 *  it is arriving rather than sitting there. */
function rays(cx, cy, n, colour, alpha, inner, outer, spin = 0) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = colour;
  for (let i = 0; i < n; i++) {
    const a0 = spin + (i / n) * Math.PI * 2, a1 = a0 + (Math.PI * 2 / n) * .46;
    g.beginPath();
    g.moveTo(cx + Math.cos(a0) * inner, cy + Math.sin(a0) * inner);
    g.lineTo(cx + Math.cos(a0) * outer, cy + Math.sin(a0) * outer);
    g.lineTo(cx + Math.cos(a1) * outer, cy + Math.sin(a1) * outer);
    g.lineTo(cx + Math.cos(a1) * inner, cy + Math.sin(a1) * inner);
    g.closePath(); g.fill();
  }
  g.restore();
}

/** A spiky burst -- sale-sticker energy, used behind badges. */
function burst(cx, cy, r, points, colour, jag = .62) {
  g.save(); g.fillStyle = colour; g.beginPath();
  for (let i = 0; i <= points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 ? r * jag : r;
    i ? g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr)
      : g.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  g.closePath(); g.fill(); g.restore();
}

function confetti(seed, n, x0, y0, x1, y1, scale = 1) {
  const r = rng(seed), cols = [C.pink, C.cyan, C.lime, C.primary, C.purple];
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, r()), y = lerp(y0, y1, r()), s = (12 + r() * 20) * scale;
    g.save(); g.translate(x, y); g.rotate(r() * 7);
    g.globalAlpha = .55 + r() * .45;
    g.fillStyle = cols[Math.floor(r() * 5)];
    g.fillRect(-s / 2, -s / 4, s, s / 2);
    g.restore();
  }
  g.globalAlpha = 1;
}

/** The background every poster sits on: violet, a hot centre, and a vignette
 *  so the middle of the frame is where the eye goes. */
function ground(cx, cy, warmth = 1) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  rays(cx, cy, 18, '#FFC53D', .055 * warmth, 40, Math.max(W, H) * 1.25, .18);
  const glow = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .62);
  glow.addColorStop(0, `rgba(255,197,61,${.20 * warmth})`);
  glow.addColorStop(.55, `rgba(255,92,138,${.06 * warmth})`);
  glow.addColorStop(1, 'rgba(255,197,61,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .30, W / 2, H / 2, Math.max(W, H) * .78);
  vig.addColorStop(0, 'rgba(11,9,32,0)'); vig.addColorStop(1, 'rgba(6,4,20,.88)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
}

/** A headline, set big, with a slab of dark behind it so it survives whatever
 *  it is sitting on. */
function headline(lines, cx, y, size, gap, { colour = C.primary, rot = -.022, band = true } = {}) {
  g.save(); g.translate(cx, y); g.rotate(rot);
  lines.forEach((ln, i) => {
    const yy = i * (size + gap);
    g.font = `900 ${size}px Roboto, Arial, sans-serif`;
    if ('letterSpacing' in g) g.letterSpacing = '2px';
    const w = g.measureText(ln).width;
    if (band) {
      g.fillStyle = 'rgba(6,4,20,.55)';
      roundRect(-w / 2 - 34, yy - size * .70, w + 68, size * 1.34, size * .22); g.fill();
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = colour; g.shadowBlur = size * .42;
    g.fillStyle = colour; g.fillText(ln, 0, yy);
    g.shadowBlur = 0;
  });
  g.restore();
}

/** A sheet of paper with a drawing already on it, tilted and lit. */
function poster(list, x, y, s, rot = 0, glowColour = null) {
  g.save();
  g.translate(x + s / 2, y + s / 2); g.rotate(rot); g.translate(-(x + s / 2), -(y + s / 2));
  if (glowColour) {
    g.save(); g.shadowColor = glowColour; g.shadowBlur = 90;
    g.fillStyle = glowColour; g.fillRect(x + 10, y + 10, s - 20, s - 20); g.restore();
  }
  g.save(); g.shadowColor = 'rgba(0,0,0,.72)'; g.shadowBlur = 70; g.shadowOffsetY = 30;
  g.fillStyle = C.paper; g.fillRect(x, y, s, s); g.restore();
  paintPaper(x, y, s, s);
  for (const st of list) strokePath(st.pts, 1, st.color, st.width * (s / 380) * .55, st.style, x, y, s);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
  g.restore();
}

/** A prompt as the game shows it: the sentence with the filled-in blank lit up. */
function promptBar(cx, y, maxW, size, parts) {
  g.save();
  g.fillStyle = 'rgba(24,19,65,.92)';
  roundRect(cx - maxW / 2 - 30, y - size * 1.5, maxW + 60, size * 3.0, size * .8); g.fill();
  g.strokeStyle = C.border; g.lineWidth = 4; g.stroke();
  g.restore();
  promptText(cx, y, maxW, size, 999, parts);
}

function pill(cx, cy, w, h, label, size, bg, fg) {
  g.save();
  g.shadowColor = bg; g.shadowBlur = 44;
  g.fillStyle = bg; roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); g.fill();
  g.restore();
  text(label, cx, cy + 2, size, fg, { spacing: 3 });
}

// The WhoseGames mark -- a glowing question mark, the pun being "whose games".
// It only exists as an animated GIF (a fixed frame of it, extracted once to
// wg-mark.png), and the gif has a baked-in dark tile behind it rather than
// transparency, so it is always drawn as a small rounded, shadowed square --
// exactly how the ad videos present it, never recoloured or run edge-to-edge.
const wgMark = new Image(); wgMark.src = 'assets/wg-mark.png';

// The four trailers' own artwork: one frame of each, cropped to the sheet of
// paper itself (no background, no caption), so a thumbnail is the same
// drawing the video opens on rather than an impression of it. Rebuilt by
// hand from the mp4s; see README.
const TRAILERS = ['life', 'mosquito', 'knights', 'duo'];
const trailerImg = {};
for (const k of TRAILERS) { const im = new Image(); im.src = `assets/trailer/${k}.png`; trailerImg[k] = im; }

function wgTile(cx, cy, size) {
  if (!(wgMark.complete && wgMark.naturalWidth)) return;
  g.save();
  g.translate(cx, cy);
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = size * .3; g.shadowOffsetY = size * .12;
  roundRect(-size / 2, -size / 2, size, size, size * .22); g.clip(); g.shadowColor = 'transparent';
  g.drawImage(wgMark, -size / 2, -size / 2, size, size);
  g.restore();
}

/** One of the trailer sheets, hung and lit exactly like poster() hangs a
 *  drawing -- same shadow, same paper edge -- so a thumbnail sits in the same
 *  world as the listing images even though its picture came from a video. */
function trailerSheet(key, cx, cy, w, rot = 0, glowColour = 'rgba(255,197,61,.30)') {
  const im = trailerImg[key];
  if (!(im && im.complete && im.naturalWidth)) return;
  const h = w * im.naturalHeight / im.naturalWidth;
  const x = cx - w / 2, y = cy - h / 2;
  g.save();
  g.translate(cx, cy); g.rotate(rot); g.translate(-cx, -cy);
  if (glowColour) { g.save(); g.shadowColor = glowColour; g.shadowBlur = 90; g.fillStyle = glowColour; g.fillRect(x + 10, y + 10, w - 20, h - 20); g.restore(); }
  g.save(); g.shadowColor = 'rgba(0,0,0,.72)'; g.shadowBlur = 70; g.shadowOffsetY = 30;
  g.fillStyle = C.paper; g.fillRect(x, y, w, h); g.restore();
  g.drawImage(im, x, y, w, h);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  g.restore();
}

/** The small brand lockup every thumbnail ends on: icon, wordmark, credit. */
function lockup(x, y, iconSize = 84) {
  if (icon.complete && icon.naturalWidth) {
    g.save(); g.translate(x + iconSize / 2, y);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 34; g.shadowOffsetY = 12;
    roundRect(-iconSize / 2, -iconSize / 2, iconSize, iconSize, iconSize * .22);
    g.clip(); g.shadowColor = 'transparent';
    g.drawImage(icon, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
    g.restore();
  }
  text('GRAND CANVAS', x + iconSize + 22, y - 14, 40, C.primary, { spacing: 4, glow: 26, align: 'left' });
  text('a  W H O S E G A M E S  game', x + iconSize + 24, y + 26, 20, C.muted, { weight: 700, align: 'left' });
}

function freeBadge(cx, cy, r, rot = -.28) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.shadowColor = 'rgba(255,92,138,.75)'; g.shadowBlur = 50;
  burst(0, 0, r, 14, C.pink, .80); g.shadowBlur = 0;
  burst(0, 0, r * .86, 14, '#FF7DA3', .82);
  text('FREE', 0, -r * .17, r * .44, '#FFFFFF', { spacing: 2 });
  text('TO PLAY', 0, r * .27, r * .22, '#FFFFFF', { spacing: 3 });
  g.restore();
}

// --- the real content -----------------------------------------------------
const D = k => buildDrawing(k);

// ===========================================================================
// 1 — the hook: a prompt, and the answer being drawn
// ===========================================================================
function shotHook() {
  ground(540, 1000, 1.1);
  headline(['DRAW THE FIX', 'FOR ANYTHING'], 540, 244, 108, 30);

  promptBar(540, 560, 860, 40, DRAWINGS.pupBrella.prompt);

  confetti(11, 26, 40, 700, 1040, 1560, 1.15);
  poster(D('pupBrella'), 110, 700, 860, -.035, 'rgba(255,197,61,.30)');

  // the pencil, still going
  pencil(300, 980, 470, -0.9);

  pill(540, 1660, 720, 116, 'THE PUP-BRELLA', 46, C.primary, C.onPrimary);
  text('You get one blank and 60 seconds.', 540, 1790, 42, C.text, { weight: 700 });
  text('161 prompts. Nobody draws the same thing twice.', 540, 1856, 32, C.muted, { weight: 700 });
}

// ===========================================================================
// 2 — the payoff: the table's money lands and it gets funded
// ===========================================================================
function shotFunded() {
  ground(540, 900, 1.35);
  headline(['GET FUNDED.'], 540, 216, 124, 0);
  text('Everyone backs one drawing. Beat $1,000 and it happens.', 540, 348, 34, C.text,
       { weight: 700 });

  const PX = 90, PY = 470, PS = 900;
  poster(D('smashOMatic'), PX, PY, PS, .02, 'rgba(30,168,74,.34)');

  // The money is placed rather than scattered: it has to frame the drawing,
  // not bury it. A screenshot where you cannot see what was drawn is selling
  // confetti.
  const SPOTS = [[70, 545, 178, -.5], [318, 438, 162, .35], [700, 432, 186, -.28],
                 [978, 592, 168, .55], [112, 1268, 174, .4], [962, 1210, 182, -.45],
                 [540, 1392, 170, .18]];
  for (const [x, y, sz, rot] of SPOTS) note(x, y, rot, sz);
  confetti(7, 70, 20, 380, 1060, 1500, 1.15);

  // the stamp, sized so the mallet still reads underneath it
  g.save(); g.translate(540, PY + PS * .50); g.rotate(-.2);
  g.shadowColor = 'rgba(30,168,74,.9)'; g.shadowBlur = 56;
  g.strokeStyle = C.funded; g.lineWidth = 15; roundRect(-320, -108, 640, 216, 26); g.stroke();
  g.lineWidth = 6; roundRect(-300, -88, 600, 176, 20); g.stroke();
  g.restore();
  text('FUNDED!', 540, PY + PS * .50, 146, C.funded, { spacing: 6, rot: -.2, glow: 42 });

  // the numbers, which are the game's own
  g.save();
  g.fillStyle = C.surface; roundRect(120, 1546, 840, 140, 70); g.fill();
  g.strokeStyle = C.border; g.lineWidth = 5; g.stroke(); g.restore();
  text('RAISED', 320, 1616, 38, C.muted, { spacing: 5 });
  text('$1,800', 660, 1616, 92, C.lime, { glow: 32 });

  pill(340, 1790, 380, 108, '+30 TROPHIES', 40, C.primary, C.onPrimary);
  pill(760, 1790, 380, 108, 'RANKED', 40, C.surface, C.text);
  freeBadge(902, 1440, 94, -.32);
}

// ===========================================================================
// 3 — the social proof: ten people, one prompt, all at once
// ===========================================================================
function shotTen() {
  ground(540, 900, 1.0);
  headline(['TEN PEOPLE.', 'ONE PROMPT.'], 540, 236, 108, 30);
  text('Everybody draws at the same time. Then you all pick a winner.',
       540, 452, 33, C.text, { weight: 700 });

  const S = 262, GAP = 20, ROWS = [2, 3, 3, 2];
  let i = 0, y = 570;
  const tilt = [-.05, .04, -.03, .05, -.04, .03, -.05, .04, -.02, .05];
  for (const n of ROWS) {
    const x0 = (1080 - (n * S + (n - 1) * GAP)) / 2;
    for (let c = 0; c < n; c++, i++) {
      poster(D(GALLERY_ORDER[i]), x0 + c * (S + GAP), y, S, tilt[i]);
    }
    y += S + GAP;
  }
  confetti(3, 34, 30, 560, 1050, 1700, 1.0);
  pill(540, 1800, 900, 120, 'ROOMS FOR TEN · PLAY WITH FRIENDS', 40, C.primary, C.onPrimary);
  freeBadge(912, 1560, 104, .26);
}

// ===========================================================================
// 4 — the reason to come back: the Daily
// ===========================================================================
function shotDaily() {
  ground(540, 880, 1.05);
  headline(['A NEW PROMPT', 'EVERY DAY'], 540, 240, 108, 30);
  text('“What lives under the sofa.”', 540, 470, 46, C.text, { weight: 700 });
  text('The same one for everybody on earth. No timer. Nothing locked.',
       540, 534, 30, C.muted, { weight: 700 });

  const S = 300, GAP = 24, X0 = (1080 - (3 * S + 2 * GAP)) / 2;
  const tilt = [-.04, .03, -.05, .04, -.03, .05, -.04, .03, -.05];
  for (let i = 0; i < 9; i++) {
    const x = X0 + (i % 3) * (S + GAP), y = 640 + Math.floor(i / 3) * (S + GAP);
    poster(buildDailyDrawing(i), x, y, S, tilt[i]);
    if (i === 1 || i === 4 || i === 7) {
      g.save(); g.translate(x + S - 40, y + 44); g.scale(2.1, 2.1);
      g.shadowColor = 'rgba(255,92,138,.8)'; g.shadowBlur = 22;
      g.beginPath(); g.moveTo(0, 8);
      g.bezierCurveTo(-14, -3, -9, -14, 0, -7);
      g.bezierCurveTo(9, -14, 14, -3, 0, 8);
      g.closePath(); g.fillStyle = C.pink; g.fill(); g.restore();
    }
  }
  confetti(19, 22, 30, 620, 1050, 1620, .9);
  pill(540, 1720, 900, 118, '405 PROMPTS · EVERY COLOUR FREE', 40, C.primary, C.onPrimary);
  text('Hearts decide it. At midnight the names come out.', 540, 1850, 34, C.text, { weight: 700 });
}

// ===========================================================================
// 5 — the feature graphic that sits on top of the listing (1024x500)
// ===========================================================================
function shotFeature() {
  ground(512, 250, 1.2);
  const tilt = [-.10, .08, -.07, .09];
  const picks = ['pupBrella', 'smashOMatic', 'deskCat', 'zapHat'];
  picks.forEach((k, i) => {
    const x = i < 2 ? -30 + i * 150 : 764 + (i - 2) * 150;
    poster(D(k), x, i % 2 ? 250 : 40, 210, tilt[i]);
  });
  const scrim = g.createLinearGradient(0, 0, W, 0);
  scrim.addColorStop(0, 'rgba(11,9,32,.35)'); scrim.addColorStop(.30, 'rgba(11,9,32,.94)');
  scrim.addColorStop(.70, 'rgba(11,9,32,.94)'); scrim.addColorStop(1, 'rgba(11,9,32,.35)');
  g.fillStyle = scrim; g.fillRect(0, 0, W, H);

  const s = 140;
  if (icon.complete && icon.naturalWidth) {
    g.save(); g.translate(214, 250);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 40; g.shadowOffsetY = 16;
    roundRect(-s / 2, -s / 2, s, s, s * .22); g.clip(); g.shadowColor = 'transparent';
    g.drawImage(icon, -s / 2, -s / 2, s, s); g.restore();
  }
  text('GRAND CANVAS', 312, 208, 64, C.primary, { spacing: 5, glow: 38, align: 'left' });
  text('Draw it. Pitch it. Get funded.', 314, 272, 31, C.text, { weight: 700, align: 'left' });
  text('RANKED · A DAILY PROMPT · ROOMS FOR TEN', 314, 316, 19, C.muted,
       { weight: 700, spacing: 2, align: 'left' });
  freeBadge(930, 86, 62, -.3);
}

// ===========================================================================
// 6 -- the YouTube channel banner (2560x1440)
// ===========================================================================
// YouTube composites this differently per device: the full 2560x1440 canvas
// only ever shows on a TV. Desktop crops to a 2560-wide, 423-tall strip
// centred vertically; mobile crops further, to a centred 1546x423 box -- the
// "safe area". Everything that has to be read (wordmark, tagline, the
// WhoseGames credit) sits inside that box; the tilted posters either side are
// free to bleed into the wider desktop crop and beyond, since losing them on
// mobile costs nothing but atmosphere.
function shotYoutube() {
  const SAFE_W = 1546, SAFE_H = 423;
  const safeX0 = (W - SAFE_W) / 2, safeX1 = safeX0 + SAFE_W;
  const safeY0 = (H - SAFE_H) / 2, safeY1 = safeY0 + SAFE_H;
  const cy = H / 2;

  ground(W / 2, cy, 1.15);
  confetti(23, 130, 0, 0, W, H, 1.3);

  // Posters flanking the lockup -- inside the desktop-visible band (the
  // centre 423px, full 2560 wide), not above or below it. The first attempt
  // put these outside that band entirely: they only ever showed on a TV, so
  // on every screen that actually matters the banner was just the lockup on
  // bare violet, which is what read as dull. Four drawings, two a side,
  // stacked so the safe zone's outer margins carry as much of the game's
  // actual look as the wordmark does.
  const flank = [
    ['pupBrella',   200, cy - 108, 316, -.08],
    ['deskCat',     360, cy + 168, 300,  .07],
    ['snoozeMitt', 2360, cy - 108, 316,  .08],
    ['zapHat',     2200, cy + 168, 300, -.07],
  ];
  for (const [key, x, y, s, rot] of flank) poster(D(key), x - s / 2, y - s / 2, s, rot);

  // A dark scrim so the posters read as a frame, not a distraction, and the
  // safe area is reliably dark enough for the wordmark at any device crop.
  const scrim = g.createLinearGradient(0, 0, W, 0);
  scrim.addColorStop(0,   'rgba(11,9,32,.30)');
  scrim.addColorStop(.30, 'rgba(11,9,32,.95)');
  scrim.addColorStop(.70, 'rgba(11,9,32,.95)');
  scrim.addColorStop(1,   'rgba(11,9,32,.30)');
  g.fillStyle = scrim; g.fillRect(0, 0, W, H);
  const scrimV = g.createLinearGradient(0, safeY0 - 90, 0, safeY1 + 90);
  scrimV.addColorStop(0, 'rgba(11,9,32,0)');
  scrimV.addColorStop(.25, 'rgba(11,9,32,.50)');
  scrimV.addColorStop(.75, 'rgba(11,9,32,.50)');
  scrimV.addColorStop(1, 'rgba(11,9,32,0)');
  g.fillStyle = scrimV; g.fillRect(0, safeY0 - 90, W, SAFE_H + 180);

  // The lockup, centred as one group in the safe box rather than pinned to
  // its left edge -- a left-aligned lockup on a 1546-wide box left the whole
  // right half empty with one badge stranded in it, which read as unfinished
  // rather than as negative space.
  // Widths measured with the same letter-spacing the draw calls below use --
  // measureText ignores letterSpacing unless it is set first, and skipping
  // that undercounts the title (11 gaps at 5px) enough to misplace anything
  // positioned off the end of it.
  const iconSize = 172, gap = 50;
  const measure = (str, weight, size, spacing) => {
    g.font = `${weight} ${size}px Roboto, Arial, sans-serif`;
    if ('letterSpacing' in g) g.letterSpacing = `${spacing}px`;
    const w = g.measureText(str).width;
    if ('letterSpacing' in g) g.letterSpacing = '0px';
    return w;
  };
  const titleW = measure('GRAND CANVAS', 900, 74, 5);
  const tagW = measure('Draw it. Pitch it. Get funded.', 700, 34, 0);
  const featW = measure('RANKED · A DAILY PROMPT · ROOMS FOR TEN', 700, 21, 2);
  const textW = Math.max(titleW, tagW, featW);
  const groupW = iconSize + gap + textW;
  const groupX = W / 2 - groupW / 2;
  const iconCx = groupX + iconSize / 2, textX = groupX + iconSize + gap;

  if (icon.complete && icon.naturalWidth) {
    g.save(); g.translate(iconCx, cy - 12);
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 50; g.shadowOffsetY = 20;
    roundRect(-iconSize / 2, -iconSize / 2, iconSize, iconSize, iconSize * .22);
    g.clip(); g.shadowColor = 'transparent';
    g.drawImage(icon, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
    g.restore();
  }
  text('GRAND CANVAS', textX, cy - 84, 74, C.primary, { spacing: 5, glow: 42, align: 'left' });
  text('Draw it. Pitch it. Get funded.', textX, cy - 12, 34, C.text, { weight: 700, align: 'left' });
  text('RANKED · A DAILY PROMPT · ROOMS FOR TEN', textX, cy + 38, 21, C.muted,
       { weight: 700, spacing: 2, align: 'left' });

  // The WhoseGames credit -- the actual ask for this image -- as its own
  // small lockup under the tagline, the same pairing the ad videos use.
  const wgY = cy + 106, wgSize = 52;
  wgTile(textX + wgSize / 2, wgY, wgSize);
  text('a  W H O S E G A M E S  game', textX + wgSize + 24, wgY, 24, C.muted,
       { weight: 700, align: 'left' });

  // Tucked above the title's right end rather than stranded out beside the
  // whole block: a badge sized to stand alone there ate the entire safe-zone
  // margin, which is exactly the room the drawings themselves needed -- and
  // the drawings are what mobile's tighter 1546-wide crop was missing.
  const badgeR = 58;
  freeBadge(textX + titleW * .82, safeY0 + badgeR + 10, badgeR, -.28);

  // Two more drawings, sized and placed to sit fully inside the safe box's
  // left and right margins -- so mobile, which only ever sees that box, still
  // gets four drawings either side of the lockup rather than none.
  const innerS = 250;
  poster(D('inkGeyser'), (safeX0 + groupX - innerS) / 2, cy - innerS / 2, innerS, -.06);
  poster(D('toastyMitt'), (groupX + groupW + safeX1 - innerS) / 2, cy - innerS / 2, innerS, .07);
}

// ===========================================================================
// 7-10 — the YouTube thumbnails, one per trailer. 1280x720, which YouTube
// serves down to about 210x118 in a sidebar, so each one is two short lines
// of gold and one big picture: anything smaller than the headline here is
// decoration, not information. The line the headline uses is the trailer's
// own caption, so the thumbnail and the first four seconds agree.
// ===========================================================================
function thumb(key, lines, tagline, { rot = -.03, sheetW = 588, sheetCx = 922, sheetCy = 316 } = {}) {
  ground(900, 340, 1.15);
  confetti(31, 24, 0, 0, W, H, .95);

  // The scrim goes down *before* the paper, not over it: a left-hand wash to
  // sit the headline on, with the sheet then laid on top at full brightness.
  // Drawn the other way round it greys out the half of the drawing nearest
  // the text, which is the half the eye lands on first.
  const scrim = g.createLinearGradient(0, 0, W * .62, 0);
  scrim.addColorStop(0, 'rgba(11,9,32,.97)'); scrim.addColorStop(.58, 'rgba(11,9,32,.88)');
  scrim.addColorStop(1, 'rgba(11,9,32,0)');
  g.fillStyle = scrim; g.fillRect(0, 0, W * .62, H);

  trailerSheet(key, sheetCx, sheetCy, sheetW, rot);

  // The headline is sized to the column rather than to a number picked by
  // hand: at 210px wide in a sidebar, two lines set as large as they fit is
  // the whole design, and a line that runs long enough to touch the paper
  // undoes it.
  const COL_CX = 306, COL_W = 556;
  const fit = (() => {
    for (let size = 88; size > 40; size -= 2) {
      g.font = `900 ${size}px Roboto, Arial, sans-serif`;
      if ('letterSpacing' in g) g.letterSpacing = '2px';
      const widest = Math.max(...lines.map(l => g.measureText(l).width));
      if ('letterSpacing' in g) g.letterSpacing = '0px';
      if (widest <= COL_W) return size;
    }
    return 40;
  })();
  const gap = Math.round(fit * .30);
  const blockH = lines.length * fit + (lines.length - 1) * gap;
  const top = 250 - blockH / 2;
  headline(lines, COL_CX, top, fit, gap, { band: false });
  if (tagline) text(tagline, COL_CX, top + blockH + 46, 29, C.text, { weight: 700 });

  lockup(56, 632);
  freeBadge(1180, 642, 58, -.3);
}

const thumbLife     = () => thumb('life',     ['DRAW IT.', 'WATCH IT LIVE.'], 'Your drawing gets up and walks off.');
const thumbMosquito = () => thumb('mosquito', ['MAN vs', 'MOSQUITO'],         'One blank. Any story you can draw.');
const thumbKnights  = () => thumb('knights',  ['TWO KNIGHTS,', 'ONE DRAGON'], 'Every story you can draw.', { headSize: 74 });
const thumbDuo      = () => thumb('duo',      ['TWO PENS.', 'ONE CANVAS.'],   '2 v 2 — coming at 10,00,000 downloads.', { sheetW: 580 });

// --- run ------------------------------------------------------------------

// --- run ------------------------------------------------------------------
const SHOTS = {
  1: { w: 1080, h: 1920, draw: shotHook },
  2: { w: 1080, h: 1920, draw: shotFunded },
  3: { w: 1080, h: 1920, draw: shotTen },
  4: { w: 1080, h: 1920, draw: shotDaily },
  5: { w: 1024, h: 500,  draw: shotFeature },
  6: { w: 2560, h: 1440, draw: shotYoutube },
  7: { w: 1280, h: 720,  draw: thumbLife },
  8: { w: 1280, h: 720,  draw: thumbMosquito },
  9: { w: 1280, h: 720,  draw: thumbKnights },
 10: { w: 1280, h: 720,  draw: thumbDuo },
};
const pick = SHOTS[new URLSearchParams(location.search).get('shot') || '1'];
prepareStage(pick.w, pick.h, { x: 0, y: 0, size: 1 });
const paint = () => { g.setTransform(1, 0, 0, 1, 0, 0); pick.draw(); };
// Two images to wait on now: the app icon, and the WhoseGames mark (only
// shotYoutube uses the latter, but there is no harm waiting for both).
let pending = 2 + TRAILERS.length;
const ready = () => { if (--pending <= 0) paint(); };
icon.complete && icon.naturalWidth ? ready() : (icon.onload = ready, icon.onerror = ready);
wgMark.complete && wgMark.naturalWidth ? ready() : (wgMark.onload = ready, wgMark.onerror = ready);
for (const k of TRAILERS) { const im = trailerImg[k];
  im.complete && im.naturalWidth ? ready() : (im.onload = ready, im.onerror = ready); }
</script>
