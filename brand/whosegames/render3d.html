<!doctype html>
<!--
  WhoseGames mark, rendered in real 3D.

  A question mark as actual geometry — a tube swept along the hook, a
  bevelled block for the dot — under a three-point light rig with an
  environment map for the clearcoat reflections. Screenshotted by headless
  Chrome at 1024px onto the energy backdrop (mark_bg.svg). Every pixel is
  produced here; nothing is lifted.

  Render:  chrome --headless=new --use-angle=swiftshader --screenshot=... render3d.html
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #05070F; }
  #bg { position: absolute; inset: 0; width: 1024px; height: 1024px; }
  canvas { position: absolute; inset: 0; }
</style>
<img id="bg" src="mark_bg.svg" alt="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const W = 1024, H = 1024;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.78;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  camera.position.set(0.6, 0.9, 15.5);
  camera.lookAt(0, -0.35, 0);

  // --- environment: a studio-ish gradient so the clearcoat has something to reflect
  const envCanvas = document.createElement("canvas");
  envCanvas.width = 512; envCanvas.height = 256;
  const g = envCanvas.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#9CC8FF");
  grad.addColorStop(0.28, "#2F6FE0");
  grad.addColorStop(0.55, "#0B2C8C");
  grad.addColorStop(1.00, "#03061A");
  g.fillStyle = grad; g.fillRect(0, 0, 512, 256);
  // A bright softbox band, so there is a crisp highlight to catch.
  g.fillStyle = "rgba(255,255,255,0.85)"; g.fillRect(60, 40, 170, 26);
  g.fillStyle = "rgba(180,220,255,0.5)"; g.fillRect(330, 70, 120, 18);
  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envMap = pmrem.fromEquirectangular(envTex).texture;

  // --- material: glossy blue, lacquered
  const blue = new THREE.MeshPhysicalMaterial({
    color: 0x0930C4,
    metalness: 0.08,
    roughness: 0.28,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    envMap, envMapIntensity: 0.55,
    reflectivity: 0.9,
  });

  // --- the hook: a smooth curve, swept as a tube
  const pts = [];
  const cx = 0, cy = 1.25, r = 1.55;
  // From the lower-left of the bowl, clockwise over the top, round to the
  // lower-right, then into the stem.
  for (let a = 205; a >= -55; a -= 4) {
    const t = a * Math.PI / 180;
    pts.push(new THREE.Vector3(cx + r * Math.cos(t), cy + r * Math.sin(t), 0));
  }
  // Curl inward and down into the stem.
  pts.push(new THREE.Vector3(0.62, -0.28, 0));
  pts.push(new THREE.Vector3(0.18, -0.75, 0));
  pts.push(new THREE.Vector3(0.0, -1.35, 0));
  pts.push(new THREE.Vector3(0.0, -1.85, 0));
  const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal", 0.6);
  const hook = new THREE.Mesh(new THREE.TubeGeometry(curve, 260, 0.56, 48, false), blue);
  // Round the ends with spheres so the caps are domed, not sliced.
  const capA = new THREE.Mesh(new THREE.SphereGeometry(0.56, 48, 32), blue);
  capA.position.copy(pts[0]);
  const capB = new THREE.Mesh(new THREE.SphereGeometry(0.56, 48, 32), blue);
  capB.position.copy(pts[pts.length - 1]);

  // --- the dot: a bevelled rounded block
  const shape = new THREE.Shape();
  const s = 0.62, rr = 0.22;
  shape.moveTo(-s + rr, -s);
  shape.lineTo(s - rr, -s); shape.quadraticCurveTo(s, -s, s, -s + rr);
  shape.lineTo(s, s - rr);  shape.quadraticCurveTo(s, s, s - rr, s);
  shape.lineTo(-s + rr, s); shape.quadraticCurveTo(-s, s, -s, s - rr);
  shape.lineTo(-s, -s + rr); shape.quadraticCurveTo(-s, -s, -s + rr, -s);
  const dotGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.9, bevelEnabled: true, bevelThickness: 0.18, bevelSize: 0.16, bevelSegments: 12, curveSegments: 24 });
  dotGeo.center();
  const dot = new THREE.Mesh(dotGeo, blue);
  dot.position.set(0, -3.35, 0);

  const mark = new THREE.Group();
  mark.add(hook, capA, capB, dot);
  // A touch of turn, so it reads as an object and not a glyph.
  mark.rotation.y = -0.34;
  mark.rotation.x = 0.06;
  mark.rotation.z = -0.03;
  mark.position.y = 0.5;
  mark.scale.setScalar(0.66);
  for (const m of [hook, capA, capB, dot]) { m.castShadow = true; m.receiveShadow = true; }
  scene.add(mark);

  // --- lights: key from upper-left, blue fill from lower-right, cyan rim from behind
  scene.add(new THREE.AmbientLight(0x0E1E5A, 0.7));
  const key = new THREE.DirectionalLight(0xFFFFFF, 1.15);
  key.position.set(-5, 7, 8);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  scene.add(key);
  const fill = new THREE.PointLight(0x2F7BFF, 0.9, 40);
  fill.position.set(6, -3, 6);
  scene.add(fill);
  const rim = new THREE.PointLight(0x7FD4FF, 1.6, 40);
  rim.position.set(1, 4, -6);
  scene.add(rim);
  const under = new THREE.PointLight(0x7FD4FF, 0.5, 30);
  under.position.set(-3, -6, 3);
  scene.add(under);

  renderer.render(scene, camera);
  document.title = "rendered";
</script>
