<!doctype html>
<!-- The lockup: the mark beside the wordmark, for the keepsake folder.
     Rendered by headless Chrome at 2400x900. Uses a system face on purpose:
     nothing loads over the network, so the screenshot is never early. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2400px; height: 900px; overflow: hidden; }
  body { background: #05070F; display: flex; align-items: center; gap: 70px; padding: 0 0 0 140px; box-sizing: border-box;
         font-family: "Segoe UI Black", "Segoe UI", "Arial Black", Arial, sans-serif; }
  body.light { background: #F3F6FA; }
  img { width: 620px; height: 620px; }
  .name { font-weight: 900; font-size: 190px; letter-spacing: -0.03em; line-height: 0.95; color: #F3F6FA; }
  body.light .name { color: #0B1430; }
  .q { color: #2F7BFF; }
  .games { color: #7FD4FF; }
  body.light .games { color: #1547C9; }
  .sub { margin-top: 26px; font-family: "Segoe UI", Arial, sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.32em; text-transform: uppercase; color: #8A98B8; }
  body.light .sub { color: #5A6890; }
</style>
<body class="__THEME__">
  <img src="glass_transparent.png" alt="">
  <div>
    <div class="name">Whose<span class="q">?</span><span class="games">Games</span></div>
    <div class="sub">A games studio · Lakshay Baijal</div>
  </div>
</body>
