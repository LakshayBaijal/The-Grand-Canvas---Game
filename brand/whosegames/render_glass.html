<!doctype html>
<!--
  WhoseGames mark: an extruded glass question mark.

  A real typographic "?" — a bold glyph extruded with a hard bevel — with a
  pale glass face and saturated blue edges, lit from the upper-left, over the
  charge-and-sparkles backdrop or on nothing at all. Rendered in Three.js and
  screenshotted by headless Chrome, so every pixel is produced here.

  Query string:
    bg=dark|none        backdrop (default dark)
    size=1024           canvas size
    t=0..1              animation phase for one still frame
    sheet=COLSxROWS     render a whole loop as a sprite sheet of frames
                        (e.g. sheet=8x6 renders 48 frames, t = i/48)
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #bg { position: absolute; left: 0; top: 0; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const SIZE = Number(q.get("size") || 1024);
  const BG = q.get("bg") || "dark";
  const sheet = (q.get("sheet") || "").match(/^(\d+)x(\d+)$/);
  const COLS = sheet ? Number(sheet[1]) : 1;
  const ROWS = sheet ? Number(sheet[2]) : 1;
  const FRAMES = COLS * ROWS;
  const W = SIZE * COLS, H = SIZE * ROWS;
  document.documentElement.style.width = W + "px";
  document.documentElement.style.height = H + "px";
  document.body.style.width = W + "px";
  document.body.style.height = H + "px";

  if (BG === "dark") {
    for (let i = 0; i < FRAMES; i++) {
      const img = document.createElement("img");
      img.src = "mark_bg.svg";
      img.style.cssText = `position:absolute;left:${(i % COLS) * SIZE}px;top:${Math.floor(i / COLS) * SIZE}px;width:${SIZE}px;height:${SIZE}px`;
      document.body.appendChild(img);
    }
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.setScissorTest(true);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
  camera.position.set(0.9, 1.1, 16);
  camera.lookAt(0, -0.2, 0);

  // --- environment: a studio gradient with a softbox, for the glass to catch
  const envCanvas = document.createElement("canvas");
  envCanvas.width = 512; envCanvas.height = 256;
  const g = envCanvas.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, "#FFFFFF");
  grad.addColorStop(0.22, "#BFE6FF");
  grad.addColorStop(0.55, "#2F7BFF");
  grad.addColorStop(1.00, "#03061A");
  g.fillStyle = grad; g.fillRect(0, 0, 512, 256);
  g.fillStyle = "rgba(255,255,255,0.95)"; g.fillRect(40, 30, 200, 30);
  g.fillStyle = "rgba(255,255,255,0.6)"; g.fillRect(330, 60, 110, 20);
  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envMap = pmrem.fromEquirectangular(envTex).texture;

  // --- materials: a pale glass face, saturated blue edges
  const face = new THREE.MeshPhysicalMaterial({
    color: 0xB4DBFF, metalness: 0.0, roughness: 0.14,
    clearcoat: 1.0, clearcoatRoughness: 0.05,
    envMap, envMapIntensity: 0.75, transparent: true, opacity: 0.92,
    emissive: 0x2B63C8, emissiveIntensity: 0.14,
  });
  const edge = new THREE.MeshPhysicalMaterial({
    color: 0x0A3CE6, metalness: 0.05, roughness: 0.38,
    clearcoat: 0.3, clearcoatRoughness: 0.3,
    envMap, envMapIntensity: 0.22,
    emissive: 0x0B36C0, emissiveIntensity: 0.75,
  });

  // --- lights
  scene.add(new THREE.AmbientLight(0x243F8A, 0.8));
  const key = new THREE.DirectionalLight(0xFFFFFF, 1.1); key.position.set(-6, 8, 9); scene.add(key);
  const fill = new THREE.PointLight(0x5FA8FF, 1.0, 50); fill.position.set(7, -3, 7); scene.add(fill);
  const rim = new THREE.PointLight(0x9CD8FF, 1.8, 50); rim.position.set(2, 5, -7); scene.add(rim);

  // --- sparkles: four-point stars as additive sprites, each with its own twinkle
  const starCanvas = document.createElement("canvas");
  starCanvas.width = starCanvas.height = 128;
  const sg = starCanvas.getContext("2d");
  sg.translate(64, 64);
  sg.fillStyle = "#EAF4FF";
  sg.beginPath();
  sg.moveTo(0, -60); sg.bezierCurveTo(4, -24, 24, -4, 60, 0);
  sg.bezierCurveTo(24, 4, 4, 24, 0, 60); sg.bezierCurveTo(-4, 24, -24, 4, -60, 0);
  sg.bezierCurveTo(-24, -4, -4, -24, 0, -60); sg.closePath(); sg.fill();
  const starTex = new THREE.CanvasTexture(starCanvas);
  const stars = [
    // Positions in world units at z = 2.5; the lens shows about +-2.9 there.
    { x: -2.1, y: 2.0, s: 0.46, p: 0.0 },
    { x: 2.2, y: 2.3, s: 0.3, p: 0.35 },
    { x: 1.7, y: -0.5, s: 0.2, p: 0.6 },
    { x: -1.8, y: -1.8, s: 0.17, p: 0.8 },
    { x: 2.35, y: -2.1, s: 0.36, p: 0.2 },
  ].map((d) => {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: starTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.set(d.x, d.y, 2.5);
    m.material.toneMapped = false;
    m.userData = d;
    scene.add(m);
    return m;
  });

  const group = new THREE.Group();
  group.scale.setScalar(0.74);
  scene.add(group);

  function build(font) {
    const geo = new THREE.TextGeometry("?", {
      font, size: 5.2, height: 1.35, curveSegments: 24,
      bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.14, bevelSegments: 6,
    });
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    // Centre the glyph, front face at z = +depth/2.
    geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, -(bb.min.z + bb.max.z) / 2);
    const mesh = new THREE.Mesh(geo, [face, edge]);
    group.add(mesh);
  }

  function pose(t) {
    // A slow, seamless float: a sway in yaw, a gentle bob, a breath in pitch.
    const a = t * Math.PI * 2;
    group.rotation.y = -0.52 + 0.2 * Math.sin(a);
    group.rotation.x = 0.10 + 0.05 * Math.sin(a * 2 + 1.2);
    group.rotation.z = -0.04;
    group.position.y = -0.05 + 0.14 * Math.sin(a + 0.6);
    for (const s of stars) {
      const d = s.userData;
      const tw = 0.55 + 0.45 * Math.max(0, Math.sin(a * 2 + d.p * Math.PI * 2));
      s.scale.setScalar(d.s * (0.75 + 0.5 * tw));
      s.material.opacity = 0.35 + 0.65 * tw;
    }
  }

  function renderAll() {
    for (let i = 0; i < FRAMES; i++) {
      const t = FRAMES === 1 ? Number(q.get("t") || 0) : i / FRAMES;
      pose(t);
      const x = (i % COLS) * SIZE;
      const y = (ROWS - 1 - Math.floor(i / COLS)) * SIZE; // GL origin is bottom-left
      renderer.setViewport(x, y, SIZE, SIZE);
      renderer.setScissor(x, y, SIZE, SIZE);
      renderer.render(scene, camera);
    }
    document.title = "rendered";
  }

  // The "?" glyph of Helvetiker Bold (three.js's example typeface, which is
  // Helvetica-derived and free), inlined so nothing loads over the network --
  // headless Chrome screenshots before an async fetch lands.
  const GLYPH = {"glyphs": {"?": {"x_min": 1, "x_max": 687, "ha": 785, "o": "m 687 734 q 621 563 687 634 q 501 454 560 508 q 436 293 436 386 l 251 293 l 251 391 q 363 557 251 462 q 476 724 476 653 q 432 827 476 788 q 332 866 389 866 q 238 827 275 866 q 195 699 195 781 l 1 699 q 110 955 1 861 q 352 1040 210 1040 q 582 963 489 1040 q 687 734 687 878 m 446 0 l 243 0 l 243 203 l 446 203 l 446 0 "}}, "familyName": "Helvetiker", "ascender": 1216, "descender": -334, "underlinePosition": -100, "underlineThickness": 50, "boundingBox": {"yMin": -333, "xMin": -162, "yMax": 1216, "xMax": 1681}, "resolution": 1000, "original_font_information": {}};
  build(new THREE.Font(GLYPH));
  renderAll();
</script>
