<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    WhoseGames — the studio mark.

    Built as an evolution of the Whosemind mark: the glossy blue 3D question
    mark, the electric-blue energy behind it, the four-point sparkles. The
    brain is gone on purpose — a games studio is not a mind — and in its place
    the energy is drawn as filaments that read as a charge, not an organ.

    Everything is vector, so this scales from a 48px launcher icon to a title
    screen without a pixel of blur, and it is original: nothing lifted.
  -->
  <defs>
    <!-- The ground: a blue charge low-left, falling to near-black. -->
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#2A6BF0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#0E2C8A" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#07143F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05070F" stop-opacity="0"/>
    </radialGradient>

    <!-- The face of the mark: lit from the top-left, deepening to the base. -->
    <linearGradient id="face" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#7AB6FF"/>
      <stop offset="0.28" stop-color="#2F7BFF"/>
      <stop offset="0.62" stop-color="#1547C9"/>
      <stop offset="1" stop-color="#0B2C8C"/>
    </linearGradient>
    <!-- The extruded side: the same blue in shadow. -->
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2470"/>
      <stop offset="1" stop-color="#040F3A"/>
    </linearGradient>
    <!-- The sheen: a ribbon of light along the upper edge, fading out. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="30" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The question mark, as one stroke: the bowl, the hook, the stem. -->
    <path id="hook" d="M 362 352 A 150 150 0 1 1 620 470 C 556 496 512 522 512 596"/>

    <!-- A four-point sparkle, centred on the origin, unit radius 1. -->
    <path id="spark" d="M 0 -1 C 0.06 -0.4 0.4 -0.06 1 0 C 0.4 0.06 0.06 0.4 0 1 C -0.06 0.4 -0.4 0.06 -1 0 C -0.4 -0.06 -0.06 -0.4 0 -1 Z"/>
  </defs>

  <!-- Ground -->
  <rect width="1024" height="1024" fill="#05070F"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Energy: filaments radiating from behind the mark. Drawn twice — a wide
       blurred pass for the glow, a thin sharp pass for the wire. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2F7BFF" stroke-width="26" opacity="0.75" filter="url(#soft)">
      <path d="M 430 470 C 360 430 300 450 250 380 C 215 330 230 270 200 220"/>
      <path d="M 445 560 C 380 590 320 560 270 610 C 230 650 240 720 190 760"/>
      <path d="M 470 400 C 440 330 380 320 372 250 C 366 205 390 160 372 118"/>
      <path d="M 600 610 C 660 650 690 720 760 740 C 810 755 850 730 890 770"/>
      <path d="M 640 420 C 700 380 720 300 790 280 C 830 268 860 290 900 262"/>
      <path d="M 512 640 C 500 700 540 760 520 830 C 508 872 470 900 480 950"/>
      <path d="M 590 350 C 640 300 700 320 740 260"/>
      <path d="M 400 620 C 360 680 300 700 280 760"/>
      <path d="M 300 300 C 260 260 250 200 200 170"/>
      <path d="M 720 500 C 780 520 800 580 860 600"/>
      <path d="M 560 250 C 540 200 570 150 540 100"/>
      <path d="M 660 690 C 700 720 700 790 740 830"/>
      <path d="M 350 520 C 300 500 260 520 220 500"/>
    </g>
    <g stroke="#9CD0FF" stroke-width="3" opacity="0.9" filter="url(#haze)">
      <path d="M 430 470 C 360 430 300 450 250 380 C 215 330 230 270 200 220"/>
      <path d="M 445 560 C 380 590 320 560 270 610 C 230 650 240 720 190 760"/>
      <path d="M 470 400 C 440 330 380 320 372 250 C 366 205 390 160 372 118"/>
      <path d="M 600 610 C 660 650 690 720 760 740 C 810 755 850 730 890 770"/>
      <path d="M 640 420 C 700 380 720 300 790 280 C 830 268 860 290 900 262"/>
      <path d="M 512 640 C 500 700 540 760 520 830 C 508 872 470 900 480 950"/>
      <path d="M 590 350 C 640 300 700 320 740 260"/>
      <path d="M 400 620 C 360 680 300 700 280 760"/>
      <path d="M 300 300 C 260 260 250 200 200 170"/>
      <path d="M 720 500 C 780 520 800 580 860 600"/>
      <path d="M 560 250 C 540 200 570 150 540 100"/>
      <path d="M 660 690 C 700 720 700 790 740 830"/>
      <path d="M 350 520 C 300 500 260 520 220 500"/>
    </g>
    <g stroke="#EAF4FF" stroke-width="1.4" opacity="0.8">
      <path d="M 430 470 C 360 430 300 450 250 380 C 215 330 230 270 200 220"/>
      <path d="M 445 560 C 380 590 320 560 270 610 C 230 650 240 720 190 760"/>
      <path d="M 470 400 C 440 330 380 320 372 250 C 366 205 390 160 372 118"/>
      <path d="M 600 610 C 660 650 690 720 760 740 C 810 755 850 730 890 770"/>
      <path d="M 640 420 C 700 380 720 300 790 280 C 830 268 860 290 900 262"/>
      <path d="M 512 640 C 500 700 540 760 520 830 C 508 872 470 900 480 950"/>
    </g>
    <!-- Nodes where filaments fork. -->
    <g fill="#EAF4FF" stroke="none">
      <circle cx="250" cy="380" r="4"/>
      <circle cx="270" cy="610" r="4"/>
      <circle cx="372" cy="250" r="4"/>
      <circle cx="760" cy="740" r="4"/>
      <circle cx="790" cy="280" r="4"/>
      <circle cx="520" cy="830" r="4"/>
    </g>
  </g>

</svg>
